<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>异环 · 芝码生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pink:#E891A5;--pink-dark:#D4707E;--pink-light:#F5C6D0;--bg:#FFF5F7;--text:#3A2030;--card:#FFFFFF;--border:#F0D0D8;--shadow:0 4px 24px rgba(200,100,130,0.12)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center}
.container{max-width:640px;width:100%;padding:20px}
h1{text-align:center;font-size:1.6em;margin:24px 0 8px;color:var(--pink-dark);letter-spacing:2px}
.subtitle{text-align:center;font-size:0.85em;color:#B07080;margin-bottom:24px}
.tabs{display:flex;gap:0;margin-bottom:20px;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.tab{flex:1;padding:14px;text-align:center;cursor:pointer;font-size:1em;font-weight:600;color:#A07080;border:none;background:transparent;transition:all .2s}
.tab.active{background:var(--pink);color:#fff}
.tab:hover:not(.active){background:var(--pink-light)}
.panel{display:none;background:var(--card);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.panel.active{display:block}
label{display:block;font-weight:600;margin-bottom:6px;font-size:0.9em}
input[type=text],input[type=url]{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:10px;font-size:1em;outline:none;transition:border-color .2s}
input:focus{border-color:var(--pink)}
.platform-indicator{font-size:0.8em;margin-top:6px;padding:4px 10px;border-radius:6px;display:inline-block}
.platform-bilibili{background:#D4E9FF;color:#00A1D6}
.platform-xiaohongshu{background:#FFE0E0;color:#FE2C55}
.platform-other{background:#EEE;color:#888}
.btn{display:inline-block;padding:12px 28px;background:var(--pink);color:#fff;border:none;border-radius:10px;font-size:1em;font-weight:600;cursor:pointer;transition:background .2s;margin-top:16px}
.btn:hover{background:var(--pink-dark)}
.btn:disabled{background:#CCC;cursor:not-allowed}
.btn-secondary{background:#F0E0E4;color:var(--pink-dark)}
.btn-secondary:hover{background:#E8D0D4}
.preview-area{text-align:center;margin-top:20px}
.preview-area canvas,.preview-area img{max-width:100%;border-radius:12px;box-shadow:var(--shadow)}
.drop-zone{border:3px dashed var(--border);border-radius:16px;padding:48px 20px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
.drop-zone.dragover{border-color:var(--pink);background:rgba(232,145,165,0.06)}
.drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop-zone p{color:#A07080;font-size:0.95em}
.drop-zone .icon{font-size:2.5em;margin-bottom:8px}
.result-box{margin-top:16px;padding:16px;background:#FFF8F0;border-radius:10px;border:1px solid #F0D8C0;word-break:break-all}
.result-box a{color:var(--pink-dark);font-weight:600}
.error-msg{color:#D44;margin-top:10px;font-size:0.9em}
.info-text{font-size:0.8em;color:#A08090;margin-top:12px}
.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.raw-payload{margin:6px 0 0;padding:10px;background:#FFF6F8;border:1px solid #F0D8E0;border-radius:8px;font-size:0.85em;white-space:pre-wrap;word-break:break-all}
.hidden{display:none}
.status{font-size:0.85em;color:#A07080;margin-top:10px;min-height:1.2em}
.tier-row{display:flex;gap:8px;margin-bottom:10px}
.tier-chip{flex:1;padding:10px 4px;border:2px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer;text-align:center;font-family:inherit;color:#A07080;transition:all .15s}
.tier-chip .lv{display:block;font-size:1.05em;font-weight:700}
.tier-chip .nm{display:block;font-size:0.75em;margin-top:2px}
.tier-chip:hover{border-color:var(--pink-light)}
.tier-chip.active{border-color:var(--pink);background:var(--pink);color:#fff}
.tier-note{font-size:0.8em;color:#A08090;line-height:1.6;background:#FFF8FA;border:1px solid var(--border);border-radius:8px;padding:8px 12px}
.tier-note b{color:var(--pink-dark)}
.tier-note.over{background:#FFF0F0;border-color:#F0B8B8;color:#C33}
.tier-note.over b{color:#C33}
canvas{image-rendering:auto}
.cam-overlay{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column}
.cam-stage{position:relative;flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cam-stage video{width:100%;height:100%;object-fit:cover}
.cam-guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(78vw,78vh);aspect-ratio:1;border:2px solid rgba(255,255,255,.55);border-radius:50%;pointer-events:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.28)}
.cam-hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-size:.82em;text-shadow:0 1px 4px #000;pointer-events:none}
.cam-bar{display:flex;align-items:center;justify-content:center;gap:18px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:#111}
.cam-btn{width:52px;height:52px;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.16);color:#fff;font-size:1.25em;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cam-btn:disabled{opacity:.35;cursor:not-allowed}
.cam-btn.shutter{width:68px;height:68px;background:#fff}
.cam-btn.on{background:var(--pink);border-color:var(--pink)}
.cam-close{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;z-index:2;width:40px;height:40px;border-radius:50%;border:none;background:rgba(0,0,0,.45);color:#fff;font-size:1.2em;cursor:pointer}
@media(max-width:480px){.container{padding:12px}h1{font-size:1.3em}.panel{padding:16px}}
</style>
</head>
<body>
<div class="container">
<h1>异环 · 芝码生成器</h1>
<p class="subtitle">Spiral Sesame Code — 贝果上的芝麻密码</p>

<div class="tabs">
  <button class="tab active" onclick="switchTab('encode')">生成芝码</button>
  <button class="tab" onclick="switchTab('decode')">扫描芝码</button>
</div>

<div id="encode-panel" class="panel active">
  <label for="url-input">输入链接</label>
  <input type="url" id="url-input" placeholder="https://www.bilibili.com/video/BV1xx..." oninput="checkPlatform()">
  <div id="platform-tag"></div>
  <label style="margin-top:16px">芝码等级</label>
  <div class="tier-row" id="tier-row"></div>
  <div class="tier-note" id="tier-note"></div>
  <button class="btn" id="encode-btn" onclick="doEncode()">生成芝码</button>
  <div id="encode-status" class="status"></div>
  <div id="encode-preview" class="preview-area hidden">
    <canvas id="output-canvas"></canvas>
    <div class="actions">
      <button class="btn btn-secondary" onclick="downloadImage()">下载图片</button>
    </div>
  </div>
  <div id="encode-error" class="error-msg hidden"></div>
</div>

<div id="decode-panel" class="panel">
  <div class="actions" style="margin-top:0;margin-bottom:16px">
    <button class="btn" id="cam-btn" style="margin-top:0" onclick="openCamera()">摄像头实时扫描</button>
    <label class="btn btn-secondary" for="capture-input" style="margin-top:0">拍照识别</label>
    <input type="file" id="capture-input" accept="image/*" capture="environment" class="hidden" onchange="handleFile(this.files[0])">
  </div>
  <div class="drop-zone" id="drop-zone">
    <input type="file" id="file-input" accept="image/*" onchange="handleFile(this.files[0])">
    <div class="icon">🍩</div>
    <p>拖放芝码图片到这里，或点击选择</p>
  </div>
  <div id="decode-preview" class="preview-area hidden">
    <img id="decode-img">
  </div>
  <button class="btn" id="decode-btn" onclick="doDecode()" disabled>解码芝码</button>
  <div id="decode-status" class="status"></div>
  <div id="decode-result" class="result-box hidden"></div>
  <div id="decode-error" class="error-msg hidden"></div>
</div>

<div id="cam-overlay" class="cam-overlay hidden">
  <div class="cam-stage">
    <video id="cam-video" playsinline muted autoplay></video>
    <div class="cam-guide" id="cam-guide"></div>
    <p class="cam-hint" id="cam-hint">把贝果放进圆圈里，尽量正对镜头</p>
    <button class="cam-close" onclick="closeCamera()">×</button>
  </div>
  <div class="cam-bar">
    <button class="cam-btn on" id="cam-auto" onclick="toggleAutoScan()">自动</button>
    <button class="cam-btn shutter" id="cam-shutter" onclick="captureStill()">拍摄</button>
    <button class="cam-btn" id="cam-torch" onclick="toggleTorch()" disabled>补光</button>
  </div>
</div>

<p class="info-text" style="text-align:center;margin-top:24px">
  支持 B站 / 小红书链接 · 四级密度，L0 容量 139 字节，L3 可远距离扫描<br>
  完全离线运行，数据不离开浏览器
</p>
</div>

<script id="codec-src">
// ============================================================
// GF(256) Arithmetic — primitive polynomial 0x11D
// ============================================================
const GF_EXP = new Uint16Array(512);
const GF_LOG = new Uint8Array(256);
(function initGF() {
  let x = 1;
  for (let i = 0; i < 255; i++) {
    GF_EXP[i] = x;
    GF_LOG[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11D;
  }
  for (let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
})();

function gf_mul(a, b) {
  if (a === 0 || b === 0) return 0;
  return GF_EXP[GF_LOG[a] + GF_LOG[b]];
}
function gf_div(a, b) {
  if (b === 0) throw new Error("div by zero");
  if (a === 0) return 0;
  return GF_EXP[(GF_LOG[a] + 255 - GF_LOG[b]) % 255];
}
function gf_inv(a) { return GF_EXP[255 - GF_LOG[a]]; }
function gf_pow(a, p) {
  if (p === 0) return 1;
  if (a === 0) return 0;
  return GF_EXP[(GF_LOG[a] * p) % 255];
}

// Polynomial ops — big-endian: poly[0] = highest degree coefficient
function poly_mul(p, q) {
  const r = new Array(p.length + q.length - 1).fill(0);
  for (let j = 0; j < q.length; j++)
    for (let i = 0; i < p.length; i++)
      r[i + j] ^= gf_mul(p[i], q[j]);
  return r;
}
function poly_add(p, q) {
  const r = new Array(Math.max(p.length, q.length)).fill(0);
  for (let i = 0; i < p.length; i++) r[i + r.length - p.length] ^= p[i];
  for (let i = 0; i < q.length; i++) r[i + r.length - q.length] ^= q[i];
  return r;
}
function poly_eval(p, x) {
  let y = p[0];
  for (let i = 1; i < p.length; i++) y = gf_mul(y, x) ^ p[i];
  return y;
}
function poly_scale(p, x) {
  return p.map(c => gf_mul(c, x));
}

// ============================================================
// Reed-Solomon Codec — matches reedsolo library
// ============================================================
class RSCodec {
  constructor(nsym) {
    this.nsym = nsym;
    this.gen = this._generator();
  }
  _generator() {
    let g = [1];
    for (let i = 0; i < this.nsym; i++) g = poly_mul(g, [1, GF_EXP[i]]);
    return g;
  }
  encode(data) {
    const nsym = this.nsym, gen = this.gen;
    const msg = new Array(data.length + nsym).fill(0);
    for (let i = 0; i < data.length; i++) msg[i] = data[i];
    for (let i = 0; i < data.length; i++) {
      const coef = msg[i];
      if (coef !== 0)
        for (let j = 1; j < gen.length; j++)
          msg[i + j] ^= gf_mul(gen[j], coef);
    }
    const out = new Uint8Array(data.length + nsym);
    for (let i = 0; i < data.length; i++) out[i] = data[i];
    for (let i = 0; i < nsym; i++) out[data.length + i] = msg[data.length + i];
    return out;
  }
  calc_syndromes(msg) {
    const syn = [];
    for (let i = 0; i < this.nsym; i++) syn[i] = poly_eval(Array.from(msg), GF_EXP[i]);
    return syn;
  }
  // Erasure locator: prod(1 + X_j * x) where X_j = alpha^(n-1-pos_j)
  find_erasure_locator(erase_pos, msg_len) {
    let loc = [1];
    for (const pos of erase_pos) {
      const Xj = GF_EXP[(msg_len - 1 - pos) % 255];
      // Factor (1 + Xj*x) in big-endian: [Xj, 1]
      loc = poly_mul(loc, [Xj, 1]);
    }
    return loc;
  }
  // Berlekamp-Massey with erasure support
  find_error_locator(synd, nsym, erase_loc) {
    let err_loc, old_loc;
    if (erase_loc && erase_loc.length > 0) {
      err_loc = Array.from(erase_loc);
      old_loc = Array.from(erase_loc);
    } else {
      err_loc = [1];
      old_loc = [1];
    }
    const synd_shift = erase_loc ? erase_loc.length - 1 : 0;
    for (let i = synd_shift; i < nsym; i++) {
      let delta = synd[i];
      for (let j = 1; j < err_loc.length; j++)
        delta ^= gf_mul(err_loc[err_loc.length - 1 - j], synd[i - j]);
      old_loc.push(0);
      if (delta !== 0) {
        if (old_loc.length > err_loc.length) {
          const new_loc = poly_scale(old_loc, delta);
          old_loc = poly_scale(err_loc, gf_inv(delta));
          err_loc = new_loc;
        }
        err_loc = poly_add(err_loc, poly_scale(old_loc, delta));
      }
    }
    let start = 0;
    while (start < err_loc.length - 1 && err_loc[start] === 0) start++;
    return err_loc.slice(start);
  }
  // Chien search
  find_errors(err_loc, msg_len) {
    const degree = err_loc.length - 1;
    const errs = [];
    for (let i = 0; i < msg_len; i++) {
      if (poly_eval(err_loc, GF_EXP[255 - i]) === 0)
        errs.push(msg_len - 1 - i);
    }
    return errs.length === degree ? errs : null;
  }
  // Forney algorithm
  correct_errata(msg, synd, err_pos) {
    const n = msg.length;
    msg = Array.from(msg);
    // Build lambda(x) = prod(1 + X_j * x) in natural order (index=power)
    let lambda = [1];
    for (const pos of err_pos) {
      const Xj = GF_EXP[(n - 1 - pos) % 255];
      const newLam = new Array(lambda.length + 1).fill(0);
      for (let i = 0; i < lambda.length; i++) {
        newLam[i] ^= lambda[i];
        newLam[i + 1] ^= gf_mul(lambda[i], Xj);
      }
      lambda = newLam;
    }
    // Omega = S(x) * lambda(x) mod x^nsym  (natural order)
    const omega = new Array(this.nsym).fill(0);
    for (let i = 0; i < synd.length; i++)
      for (let j = 0; j < lambda.length && (i + j) < this.nsym; j++)
        omega[i + j] ^= gf_mul(synd[i], lambda[j]);
    // For each error position
    for (const pos of err_pos) {
      const Xj = GF_EXP[(n - 1 - pos) % 255];
      const Xj_inv = gf_inv(Xj);
      // Evaluate omega at Xj_inv
      let omega_val = 0, xp = 1;
      for (let i = 0; i < omega.length; i++) {
        omega_val ^= gf_mul(omega[i], xp);
        xp = gf_mul(xp, Xj_inv);
      }
      // Evaluate lambda' at Xj_inv: lambda'(x) = sum_{k odd} lambda[k] * x^{k-1}
      let lp_val = 0, xp2 = 1;
      for (let k = 1; k < lambda.length; k += 2) {
        lp_val ^= gf_mul(lambda[k], xp2);
        xp2 = gf_mul(xp2, gf_mul(Xj_inv, Xj_inv));
      }
      if (lp_val === 0) return null;
      // Forney: Y = X * Omega(X^{-1}) / Lambda'(X^{-1})
      msg[pos] ^= gf_div(gf_mul(Xj, omega_val), lp_val);
    }
    return msg;
  }
  decode(received, erase_pos) {
    const msg = Array.from(received);
    const msg_len = msg.length;
    const nsym = this.nsym;
    const synd = this.calc_syndromes(msg);
    let all_zero = true;
    for (const s of synd) if (s !== 0) { all_zero = false; break; }
    if (all_zero) return new Uint8Array(msg.slice(0, msg_len - nsym));

    const ne = erase_pos ? erase_pos.length : 0;
    let erase_loc = null;
    if (ne > 0) erase_loc = this.find_erasure_locator(erase_pos, msg_len);

    const err_loc = this.find_error_locator(synd, nsym, erase_loc);
    const degree = err_loc.length - 1;
    const num_errors = degree - ne;
    if (num_errors < 0 || 2 * num_errors + ne > nsym) return null;

    const err_pos = this.find_errors(err_loc, msg_len);
    if (err_pos === null) return null;

    const all_pos = erase_pos ? [...erase_pos, ...err_pos] : [...err_pos];
    const corrected = this.correct_errata(msg, synd, all_pos);
    if (corrected === null) return null;

    const syn2 = this.calc_syndromes(corrected);
    for (const s of syn2) if (s !== 0) return null;

    return new Uint8Array(corrected.slice(0, msg_len - nsym));
  }
}

// ============================================================
// Seeded PRNG — LCG matching between JS and Python
// ============================================================
function seededRandom(seed) {
  let s = seed | 0;
  return function() {
    // Math.imul keeps the multiply in 32-bit, matching Python's exact ints
    s = (Math.imul(s, 1103515245) + 12345) & 0x7fffffff;
    return s / 0x7fffffff;
  };
}
function fisherYatesShuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ============================================================
// Constants
// ============================================================
const DEFAULT_IMAGE_SIZE = 1024;
const DEFAULT_EC = 30;
const DEFAULT_SEED = 42;
const VERSION_HEADER = [0x53, 0x53, 0x4D, 0x36]; // 'SSM6'
const REPEAT = 5;
const WHITEN_SEED = 7;
const RING_OUTER_RATIO = 0.46;
const RING_INNER_RATIO = 0.16;
const SESAME_SPACING = 9.0;
const METADATA_BYTES = 3;
const SESAME_PRESENT_MIN = 205;
const SESAME_ABSENT_MAX = 192;
const VERSION_TABLE = {1: 30, 2: 70, 3: 144};

// Density tiers (芝码等级). A coarse tier fuses an m×m block of grid cells into
// one sesame, which buys scan distance -- what limits a phone camera is the
// pitch on the sensor, and merging m×m cells multiplies it by m. Capacity falls
// as ~1/m², so the redundancy moves out of REPEAT and RS and into the merge
// itself, since one m=3 sesame already covers nine m=1 cell areas. That is why
// repeat and ec drop as merge rises; keeping L0's REPEAT=5 and EC=30 at m=2
// would leave exactly one byte of payload.
// tier_id -> [merge, repeat, ec]
const TIER_TABLE = {
  0: [1, 5, 30],   // 标准: 手持近扫
  1: [2, 3, 20],   // 均衡
  2: [3, 2, 8],    // 远距
  3: [4, 1, 8]     // 超远: 墙面海报 / 大屏幕
};
const TIER_IDS = [0, 1, 2, 3];
const DEFAULT_TIER = 0;
const TIER_NAMES = {0: '标准', 1: '均衡', 2: '远距', 3: '超远'};
// What each tier trades away, for the picker's caption. Measured on rendered
// PNGs: the smallest square that still decodes, and the widest white wedge
// over the seed ring it survives.
const TIER_NOTES = {
  0: '手持近扫，抗遮挡最强',
  1: '密度与距离折中',
  2: '一米开外可扫',
  3: '墙面海报 / 大屏幕'
};
const TIER_MIN_PX = {0: 180, 1: 220, 2: 120, 3: 120};
const TIER_OCCL_DEG = {0: 60, 1: 60, 2: 30, 3: 10};

// The tier rides in the high bits of the version byte. version is 1..3 and tier
// is 0..3, so the byte tops out at 15 with four bits spare, and tier=0 packs to
// exactly the byte today's codes already carry -- which is what keeps old
// renders decoding unchanged and new L0 renders byte-identical.
const TIER_SHIFT = 2;
const VERSION_MASK = (1 << TIER_SHIFT) - 1;
function packVersionByte(tier, version) { return (tier << TIER_SHIFT) | version; }
function unpackVersionByte(b) {
  return {tier: b >> TIER_SHIFT, version: b & VERSION_MASK};
}

function getRingParams(imageSize) {
  const half = Math.floor(imageSize / 2);
  return {
    outer_r: Math.floor(half * RING_OUTER_RATIO * 2),
    inner_r: Math.floor(half * RING_INNER_RATIO * 2)
  };
}

// ============================================================
// Polar Grid Builder
// ============================================================
function buildPolarGrid(cx, cy, inner_r, outer_r, spacing, fixedCount) {
  const cells = [];
  const n_rings = Math.max(1, Math.floor((outer_r - inner_r) / spacing));
  const actual_r_step = (outer_r - inner_r) / n_rings;
  for (let ri = 0; ri < n_rings; ri++) {
    const r = inner_r + actual_r_step * (ri + 0.5);
    const circ = 2 * Math.PI * r;
    const n_angles = Math.max(1, Math.floor(circ / spacing));
    const angle_step = 2 * Math.PI / n_angles;
    const offset = (ri % 2) ? angle_step * 0.5 : 0;
    for (let ai = 0; ai < n_angles; ai++) {
      const angle = ai * angle_step + offset;
      cells.push({ x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle), ri, ai });
    }
  }
  if (fixedCount !== undefined) {
    if (cells.length >= fixedCount) return cells.slice(0, fixedCount);
    const rng = seededRandom(12345);
    while (cells.length < fixedCount) {
      const angle = rng() * 2 * Math.PI;
      const rf = inner_r + (0.1 + rng() * 0.8) * (outer_r - inner_r);

// Full grid layout for one density tier at one image size. Cached: building the
// L0 grid costs a few milliseconds and the decoder re-reads it per tier sweep.
const _geomCache = new Map();

  if (imageSize === undefined) imageSize = DEFAULT_IMAGE_SIZE;
  const key = tier * 100000 + imageSize;
  let g = _geomCache.get(key);
  if (g) return g;
  const merge = TIER_TABLE[tier][0], repeat = TIER_TABLE[tier][1],
        ec = TIER_TABLE[tier][2];
  const cx = Math.floor(imageSize / 2), cy = cx;
  const {outer_r, inner_r} = getRingParams(imageSize);
  const grid = buildPolarGrid(cx, cy, inner_r + 4, outer_r - 4,
                              SESAME_SPACING * merge);
  const gridCount = grid.length;
  const nLogical = Math.floor(gridCount / repeat);
  g = {tier, merge, repeat, ec, cx, cy, outer_r, inner_r,
       grid, gridCount, nLogical, nPhysical: nLogical * repeat};
  _geomCache.set(key, g);
  return g;
}

// Payload bytes a tier holds, after the 13-byte framing overhead.
function tierCapacity(tier, imageSize) {
  const g = tierGeometry(tier, imageSize);
  const overhead = METADATA_BYTES + VERSION_HEADER.length + 2 + 4 + g.ec;
  return Math.max(0, Math.floor(g.nLogical / 8) - overhead);

  for (let i = 0; i < n; i++) out[i] = rng() < 0.5 ? 1 : 0;
  return out;
}

// ============================================================
// Sector Interleaver
// ============================================================
class SectorInterleaver {
  constructor(grid, nPhysical, repeat, seed) {
    this.repeat = repeat;
    this.nPhysical = nPhysical;
    const cx = grid.reduce((s, c) => s + c.x, 0) / grid.length;
    const cy = grid.reduce((s, c) => s + c.y, 0) / grid.length;
    const angles = [];
    for (let i = 0; i < Math.min(nPhysical, grid.length); i++)
      angles.push(Math.atan2(grid[i].y - cy, grid[i].x - cx));
    const sectors = Array.from({length: repeat}, () => []);
    for (let i = 0; i < angles.length; i++) {
      // +1e-6 keeps cells exactly on a sector boundary assigned
      // identically despite 1-ulp trig differences across languages
      const s = Math.floor((angles[i] + Math.PI) / (2 * Math.PI) * repeat + 1e-6) % repeat;
      sectors[s].push(i);
    }
    const rng = seededRandom(seed);
    for (const s of sectors) fisherYatesShuffle(s, rng);
    const logicalCount = Math.floor(nPhysical / repeat);
    this.logicalToPhys = [];
    const used = new Set();
    for (let bitIdx = 0; bitIdx < logicalCount; bitIdx++) {
      const assigned = [];
      for (let rep = 0; rep < repeat; rep++) {
        const sector = sectors[rep];
        let found = false;
        const start = bitIdx % sector.length;
        for (let offset = 0; offset < sector.length; offset++) {
          const candidate = sector[(start + offset) % sector.length];
          if (!used.has(candidate)) { assigned.push(candidate); used.add(candidate); found = true; break; }
        }
        if (!found) {
          for (let p = 0; p < nPhysical; p++)
            if (!used.has(p)) { assigned.push(p); used.add(p); break; }
        }
      }
      this.logicalToPhys.push(assigned);
    }
    this.logicalToPhysical = new Array(nPhysical).fill(0);
    this.physicalToLogical = new Array(nPhysical).fill(0);
    let lp = 0;
    for (let bi = 0; bi < logicalCount; bi++)
      for (let rep = 0; rep < repeat; rep++) {
        const pp = this.logicalToPhys[bi][rep];
        this.logicalToPhysical[lp] = pp;
        this.physicalToLogical[pp] = lp;
        lp++;
      }
  }
  interleave(bits) {
    const out = new Array(this.nPhysical).fill(0);
    for (let i = 0; i < bits.length && i < this.nPhysical; i++)
      out[this.logicalToPhysical[i]] = bits[i];
    return out;
  }
  deinterleaveWithErasures(values) {
    const out = new Array(this.nPhysical).fill(null);
    for (let i = 0; i < Math.min(this.nPhysical, values.length); i++)
      out[this.physicalToLogical[i]] = values[i];
    return out;
  }
}

// ============================================================
// Bagel Renderer (Canvas)
// ============================================================
function drawBagel(ctx, size, cx, cy, outer_r, inner_r, seed) {
  const imgData = ctx.createImageData(size, size);
  const d = imgData.data;
  // Use a separate PRNG for noise so it doesn't interfere with other uses
  const rng = seededRandom(seed);
  for (let py = 0; py < size; py++) {
    for (let px = 0; px < size; px++) {
      const idx = (py * size + px) * 4;
      const dx = px - cx, dy = py - cy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < outer_r && dist > inner_r) {
        const t = (dist - inner_r) / (outer_r - inner_r);
        const shade = Math.max(0, Math.min(1, 0.55 + 0.45 * Math.sin(t * Math.PI)));
        const noise = (rng() - 0.5) * 12;
        d[idx]   = Math.max(0, Math.min(255, Math.round(205*shade+20+noise)));
        d[idx+1] = Math.max(0, Math.min(255, Math.round(118*shade+28+noise)));
        d[idx+2] = Math.max(0, Math.min(255, Math.round(138*shade+32+noise)));
        d[idx+3] = 255;
      } else if (dist <= inner_r) {
        d[idx]=245; d[idx+1]=230; d[idx+2]=235; d[idx+3]=255;
      } else {
        d[idx]=255; d[idx+1]=255; d[idx+2]=255; d[idx+3]=255;
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
  ctx.strokeStyle = 'rgb(170,90,110)';
  ctx.lineWidth = 2;
  for (let off = 0; off < 2; off++) {
    ctx.beginPath(); ctx.arc(cx, cy, outer_r-off, 0, 2*Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, inner_r+off, 0, 2*Math.PI); ctx.stroke();
  }
}

// White teardrop sesame: sharp tip aimed at the bagel center
const SESAME_TIP_LEN = 6.0;
const SESAME_BODY_A = 4.5;
const SESAME_BODY_B = 2.8;
const SESAME_HIGHLIGHT_BACK = 1.0;   // bright highlight this far behind centre

function teardropPoints(x, y, ux, uy, tipLen, a, b) {
  const vx = -uy, vy = ux;
  const pts = [[x + ux * tipLen, y + uy * tipLen]];
  for (let deg = 40; deg <= 320; deg += 20) {
    const ar = deg * Math.PI / 180;
    const ca = Math.cos(ar), sa = Math.sin(ar);
    pts.push([x + ux * (a * ca) + vx * (b * sa),
              y + uy * (a * ca) + vy * (b * sa)]);
  }
  return pts;
}

function fillTeardrop(ctx, pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fill();
}

// `scale` multiplies the whole teardrop; a coarse density tier passes its merge
// factor so one sesame still fills its m×m block of cells.
function drawSesame(ctx, x, y, angleToCenter, scale) {
  if (scale === undefined) scale = 1.0;
  const ux = Math.cos(angleToCenter), uy = Math.sin(angleToCenter);
  ctx.fillStyle = 'rgb(240,228,190)';
  fillTeardrop(ctx, teardropPoints(x, y, ux, uy,
    SESAME_TIP_LEN * scale, SESAME_BODY_A * scale, SESAME_BODY_B * scale));
  ctx.strokeStyle = 'rgb(205,190,145)';
  ctx.lineWidth = 1;
  ctx.stroke();
  const back = SESAME_HIGHLIGHT_BACK * scale;
  const hx = x - ux * back, hy = y - uy * back;
  ctx.fillStyle = 'rgb(252,246,222)';
  fillTeardrop(ctx, teardropPoints(hx, hy, ux, uy,
    SESAME_TIP_LEN * 0.45 * scale, SESAME_BODY_A * 0.45 * scale,
    SESAME_BODY_B * 0.42 * scale));
}

// ============================================================
// Encoder
// ============================================================
function encodeToCanvas(text, canvas, tier) {
  if (tier === undefined) tier = DEFAULT_TIER;
  if (TIER_TABLE[tier] === undefined)
    throw new Error(`未知芝码等级: ${tier}`);
  const g = tierGeometry(tier);
  const data = new TextEncoder().encode(text);
  const sz = DEFAULT_IMAGE_SIZE;
  const cx = g.cx, cy = g.cy;
  const rs = new RSCodec(g.ec);
  const grid = g.grid;

  const capacity = tierCapacity(tier);
  if (data.length > capacity)
    throw new Error(`数据过长: ${data.length} 字节, L${tier} 最大 ${capacity}`);

  let version = 0;
  for (const v of [1,2,3]) if (data.length <= VERSION_TABLE[v]) { version = v; break; }
  if (!version) throw new Error('数据过长');

  // Metadata: version+tier(1B) + length(2B)
  const metaBytes = new Uint8Array([packVersionByte(tier, version),
                                    (data.length>>8)&0xFF, data.length&0xFF]);
  const metaBits = [];
  for (const b of metaBytes) for (let i = 7; i >= 0; i--) metaBits.push((b>>i)&1);

  // Payload + hash
  const payload = new Uint8Array(VERSION_HEADER.length + 2 + data.length);
  payload.set(VERSION_HEADER, 0);
  payload[VERSION_HEADER.length] = (data.length>>8)&0xFF;
  payload[VERSION_HEADER.length+1] = data.length&0xFF;
  payload.set(data, VERSION_HEADER.length+2);
  const digest = sha256First4(payload);
  const full = new Uint8Array(payload.length + 4);
  full.set(payload, 0); full.set(digest, payload.length);

  const encoded = rs.encode(full);
  const dataBits = [];
  for (const b of encoded) for (let i = 7; i >= 0; i--) dataBits.push((b>>i)&1);

  // Combine meta + data + padding, then whiten for ~50% sesame density
  const allLogical = [...metaBits, ...dataBits];
  while (allLogical.length < g.nLogical) allLogical.push(0);
  allLogical.length = g.nLogical;
  const whit = whiteningSequence(g.nLogical);
  for (let i = 0; i < g.nLogical; i++) allLogical[i] ^= whit[i];

  // Repeat
  const physicalBits = [];
  for (const b of allLogical) for (let r = 0; r < g.repeat; r++) physicalBits.push(b);

  // Interleave with full grid size (matching decoder)
  const interleaver = new SectorInterleaver(grid, g.nPhysical, g.repeat, DEFAULT_SEED);
  const scattered = interleaver.interleave(physicalBits);

  // Render: sesame ONLY where bit==1, tip aimed at the center
  canvas.width = sz; canvas.height = sz;
  const ctx = canvas.getContext('2d');
  drawBagel(ctx, sz, cx, cy, g.outer_r, g.inner_r, DEFAULT_SEED);

  for (let i = 0; i < Math.min(g.nPhysical, grid.length); i++) {
    if (scattered[i] !== 1) continue;
    const angle = Math.atan2(cy - grid[i].y, cx - grid[i].x);
    drawSesame(ctx, grid[i].x, grid[i].y, angle, g.merge);
  }
}
