        let v = tmp[o + x0];
        for (let xx = x0 + 1; xx <= x1; xx++) {
          const t = tmp[o + xx];
          if (t > v) v = t;
        }
        out[o + x] = v;
      }
    }
  }
  return out;
}

// White top-hat: image minus its morphological opening. Keeps bright blobs
// smaller than k and cancels broad shading and background texture, which a
// plain high-pass would leave competing with the seeds.
function tophatF(a, w, h, k) {
  const n = w * h;
  const out = new Float64Array(n);
  if (k <= 1) {
    const b = boxBlurF(a, w, h, 8);
    for (let i = 0; i < n; i++) out[i] = a[i] - b[i];
    return out;
  }
  const opened = movExtremeF(movExtremeF(a, w, h, k, true), w, h, k, false);
  for (let i = 0; i < n; i++) out[i] = a[i] - opened[i];
  return out;
}

// Flood-fill of pure-white regions connected to the frame border: a torn or
// white-background edge must read as an erasure, never as a seed.
function borderWhiteF(gray, w, h, thresh) {
  const mask = new Uint8Array(w * h);
  const stack = [];
  const push = i => { if (gray[i] >= thresh && !mask[i]) { mask[i] = 1; stack.push(i); } };
  for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
  while (stack.length) {
    const i = stack.pop(), x = i % w;
    if (x > 0) push(i - 1);
    if (x < w - 1) push(i + 1);
    if (i >= w) push(i - w);
    if (i < (h - 1) * w) push(i + w);
  }
  return mask;
}

function solveLin5(A, b) {
  const n = 5, stride = n + 1;
  const M = new Float64Array(n * stride);
  let mag = 0;
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      M[i * stride + j] = A[i * n + j];
      const av = Math.abs(A[i * n + j]);
      if (av > mag) mag = av;
    }
    M[i * stride + n] = b[i];
  }
  // Relative, not absolute: the caller's coefficients can legitimately span
  // many orders of magnitude (x^4 against x), and only rank deficiency -- not
  // smallness -- makes the system unsolvable.
  const pvFloor = mag > 0 ? 1e-14 * mag : 0;
  for (let c = 0; c < n; c++) {
    let piv = c, pv = Math.abs(M[c * stride + c]);
    for (let r = c + 1; r < n; r++) {
      const v = Math.abs(M[r * stride + c]);
      if (v > pv) { pv = v; piv = r; }
    }
    if (pv <= pvFloor) return null;
    if (piv !== c) {
      for (let j = 0; j <= n; j++) {
        const t = M[c * stride + j];
        M[c * stride + j] = M[piv * stride + j];
        M[piv * stride + j] = t;
      }
    }
    const d = M[c * stride + c];
    for (let r = c + 1; r < n; r++) {
      const f = M[r * stride + c] / d;
      if (f === 0) continue;
      for (let j = c; j <= n; j++) M[r * stride + j] -= f * M[c * stride + j];
    }
  }
  const x = new Float64Array(n);
  for (let i = n - 1; i >= 0; i--) {
    let s = M[i * stride + n];
    for (let j = i + 1; j < n; j++) s -= M[i * stride + j] * x[j];
    x[i] = s / M[i * stride + i];
  }
  return x;
}

// Eigenpair of a symmetric 2x2, ascending by eigenvalue, matching eigh's
// ordering. Vector sign is arbitrary -- every consumer of psi is invariant
// under a pi shift, so it does not have to agree with LAPACK's.
function symEigen2(p, q, r) {
  const tr = p + r, det = p * r - q * q;
  const sq = Math.sqrt(Math.max(tr * tr / 4 - det, 0));
  const lam0 = tr / 2 - sq, lam1 = tr / 2 + sq;
  let vx, vy;
  if (Math.abs(q) > 1e-14 * Math.max(1, Math.abs(tr))) { vx = lam0 - r; vy = q; }
  else if (p <= r) { vx = 1; vy = 0; }
  else { vx = 0; vy = 1; }
  return {lam0, lam1, v0x: vx, v0y: vy};
}

// Algebraic ellipse fit with 2.5-sigma clipping -> {cx, cy, a, asp, psi}.
function conicFit(pxIn, pyIn) {
  let xs = Float64Array.from(pxIn), ys = Float64Array.from(pyIn);
  if (xs.length < 24) return null;
  let cx = 0, cy = 0, aMaj = 0, asp = 0, psi = 0;
  for (let iter = 0; iter < 3; iter++) {
    const n = xs.length;
    if (n < 24) return null;
    // No centering, no scaling, however tempting: the design matrix is
    // [x^2, xy, y^2, x, y] against a constant term pinned at 1, and any affine
    // change of variables folds into that constant. Rescaling would silently
    // reweight the least-squares problem and flip the sign of `val`, which the
    // ellipse test below depends on.
    const A = new Float64Array(25), rhs = new Float64Array(5);
    for (let i = 0; i < n; i++) {
      const u = xs[i], v = ys[i];
      const f0 = u * u, f1 = u * v, f2 = v * v;
      const f = [f0, f1, f2, u, v];
      for (let a = 0; a < 5; a++) {
        rhs[a] -= f[a];
        const fa = f[a], row = a * 5;
        for (let b = 0; b < 5; b++) A[row + b] += fa * f[b];
      }
    }
    const sol = solveLin5(A, rhs);
    if (!sol) return null;
    const Ac = sol[0], Bc = sol[1], Cc = sol[2], Dc = sol[3], Fc = sol[4];
    const p = Ac, q = Bc / 2, r = Cc;
    const detM = 4 * p * r - Bc * Bc;
    if (Math.abs(detM) < 1e-12 * (4 * Math.abs(p * r) + Bc * Bc)) return null;
    const cu = (-2 * r * Dc + Bc * Fc) / detM;
    const cv = (-2 * p * Fc + Bc * Dc) / detM;
    const val = (p * cu * cu + Bc * cu * cv + r * cv * cv) + Dc * cu + Fc * cv + 1;
    if (val >= -1e-9) return null;
    const inv = 1 / (-val);
    const eig = symEigen2(p * inv, q * inv, r * inv);
    if (eig.lam0 <= 1e-12 || eig.lam1 <= 1e-12) return null;
    const ax0 = 1 / Math.sqrt(eig.lam0), ax1 = 1 / Math.sqrt(eig.lam1);
    cx = cu; cy = cv;
    psi = Math.atan2(eig.v0y, eig.v0x);
    aMaj = ax0;
    asp = ax1 / ax0;

    const bMin = Math.max(aMaj * asp, 1e-9);
    const resid = new Float64Array(n);
    let rsum = 0;
    for (let i = 0; i < n; i++) {
      const dx = xs[i] - cx, dy = ys[i] - cy;
      const tt = Math.atan2(dy, dx) - psi;
      const ct = Math.cos(tt), st = Math.sin(tt);
      const rmod = 1 / Math.sqrt(ct * ct / (aMaj * aMaj) + st * st / (bMin * bMin));
      resid[i] = Math.abs(Math.sqrt(dx * dx + dy * dy) - rmod);
      rsum += resid[i];
    }
    const rmean = rsum / n;
    let rv = 0;
    for (let i = 0; i < n; i++) { const d = resid[i] - rmean; rv += d * d; }
    const lim = Math.max(2.5 * Math.sqrt(rv / n), 1.5);
    const kx2 = [], ky2 = [];
    for (let i = 0; i < n; i++) if (resid[i] < lim) { kx2.push(xs[i]); ky2.push(ys[i]); }
    if (kx2.length < 24) break;
    xs = Float64Array.from(kx2); ys = Float64Array.from(ky2);
  }
  if (xs.length < 24) return null;
  return {cx, cy, a: aMaj, asp: Math.min(Math.max(asp, 0.3), 1.0), psi};
}

// 8-DOF pose: rotate by phi, radial keystone, anisotropic squeeze about theta,
// scale, translate. This is a complete homography parameterization, so any
// tilted plane can be represented exactly.
function projectPoint(prm, px, py) {
  const cp = Math.cos(prm.phi), sp = Math.sin(prm.phi);
  let ux = px * cp - py * sp;
  let uy = px * sp + py * cp;
  let d = 1 + (prm.kx * ux + prm.ky * uy) / R0;
  d = d < 0.35 ? 0.35 : (d > 2.5 ? 2.5 : d);
  ux /= d; uy /= d;
  const ct = Math.cos(prm.theta), st = Math.sin(prm.theta);
  const u = ux * ct - uy * st;
  const v = (ux * st + uy * ct) * prm.aspect;
  return [prm.cx + (u * ct + v * st) * prm.scale,
          prm.cy + (-u * st + v * ct) * prm.scale];
}

function clonePose(p) {
  return {cx: p.cx, cy: p.cy, scale: p.scale, aspect: p.aspect,
          theta: p.theta, phi: p.phi, kx: p.kx, ky: p.ky};
}

// Per-tier decoder state: the grid plus everything derived from it. Built
// lazily and cached per tier, because the pose search re-samples the grid
// thousands of times and the interleaver costs a few milliseconds. The encode
// path never touches any of it.
//
// The hot loops below read `CAM.n` / `CAM.nLogical` / `CAM.repeat` into locals
// rather than dereferencing per iteration: the pose search calls them millions
// of times and a property load in a loop bound is not hoisted.
const _camCache = new Map();
const CAM = {
  tier: -1, merge: 1, repeat: REPEAT, ec: DEFAULT_EC, n: 0, nLogical: 0,
  _grid: null, _inter: null, _whit: null,
  qx: null, qy: null, xs: null, ys: null, vals: null, bits: null, copies: null,
  setTier(tier) {
    if (this.tier === tier) return;
    let st = _camCache.get(tier);
    if (!st) {
      const g = tierGeometry(tier);
      st = {geom: g, grid: g.grid,
            inter: new SectorInterleaver(g.grid, g.nPhysical, g.repeat,
                                         DEFAULT_SEED),
            whit: whiteningSequence(g.nLogical)};
      const half = DEFAULT_IMAGE_SIZE / 2;
      st.qx = new Float64Array(g.nPhysical);
      st.qy = new Float64Array(g.nPhysical);
      for (let i = 0; i < g.nPhysical; i++) {
        st.qx[i] = g.grid[i].x - half;
        st.qy[i] = g.grid[i].y - half;
      }
      st.xs = new Float64Array(g.nPhysical);
      st.ys = new Float64Array(g.nPhysical);
      st.vals = new Float64Array(g.nPhysical);
      st.bits = new Int8Array(g.nPhysical);
      st.copies = new Int32Array(g.nLogical * g.repeat);
      for (let k = 0; k < g.nLogical; k++)
        for (let r = 0; r < g.repeat; r++)
          st.copies[k * g.repeat + r] = st.inter.logicalToPhys[k][r];
      _camCache.set(tier, st);
    }
    const g = st.geom;
    this.tier = tier;
    this.merge = g.merge; this.repeat = g.repeat; this.ec = g.ec;
    this.n = g.nPhysical; this.nLogical = g.nLogical;
    this._grid = st.grid; this._inter = st.inter; this._whit = st.whit;
    this.qx = st.qx; this.qy = st.qy; this.xs = st.xs; this.ys = st.ys;
    this.vals = st.vals; this.bits = st.bits; this.copies = st.copies;
  }
};

function projectAll(prm) {
  const {qx, qy, xs, ys} = CAM;
  const cp = Math.cos(prm.phi), sp = Math.sin(prm.phi);
  const ct = Math.cos(prm.theta), st = Math.sin(prm.theta);
  const kx = prm.kx / R0, ky = prm.ky / R0;
  const asp = prm.aspect, sc = prm.scale, ox = prm.cx, oy = prm.cy;
  const n = CAM.n;
  for (let i = 0; i < n; i++) {
    const px = qx[i], py = qy[i];
    let ux = px * cp - py * sp;
    let uy = px * sp + py * cp;
    let d = 1 + kx * ux + ky * uy;
    d = d < 0.35 ? 0.35 : (d > 2.5 ? 2.5 : d);
    ux /= d; uy /= d;
    const u = ux * ct - uy * st;
    const v = (ux * st + uy * ct) * asp;
    xs[i] = ox + (u * ct + v * st) * sc;
    ys[i] = oy + (-u * st + v * ct) * sc;
  }
}

// Bilinear sample of every cell; NaN marks a cell that fell outside the frame.
//
// The range test is on the float coordinate rather than the floored index, so
// the truncating `|0` is safe (non-negative) and the inner loop never calls
// Math.floor -- which V8 declines to inline here and which cost 30x more than
// the sampling itself.
function sampleCells(img, w, h, vals) {
  const {xs, ys} = CAM;
  const wLim = w - 1, hLim = h - 1, n = CAM.n;
  for (let i = 0; i < n; i++) {
    const X = xs[i], Y = ys[i];
    if (X < 0 || X >= wLim || Y < 0 || Y >= hLim) { vals[i] = NaN; continue; }
    const x0 = X | 0, y0 = Y | 0;
    const fx = X - x0, fy = Y - y0, o = y0 * w + x0;
    const a = img[o], b = img[o + 1], c = img[o + w], d = img[o + w + 1];
    vals[i] = a * (1 - fx) * (1 - fy) + b * fx * (1 - fy)
            + c * (1 - fx) * fy + d * fx * fy;
  }
}

// Otsu threshold plus the normalized between-class separability.
function otsuF(vals) {
  const n = vals.length;
  let count = 0, lo = Infinity, hi = -Infinity;
  for (let i = 0; i < n; i++) {
    const v = vals[i];
    if (v === v) { count++; if (v < lo) lo = v; if (v > hi) hi = v; }
  }
  if (count < 64) return null;
  if (hi - lo < 1e-9) return {t: lo, eta: -1};
  const bins = 64, span = hi - lo;
  const hist = new Float64Array(bins);
  for (let i = 0; i < n; i++) {
    const v = vals[i];
    if (v !== v) continue;
    let b = ((v - lo) / span * bins) | 0;
    if (b >= bins) b = bins - 1; else if (b < 0) b = 0;
    hist[b]++;
  }
  const centers = new Float64Array(bins), wt = new Float64Array(bins);
  let mu = 0;
  for (let i = 0; i < bins; i++) {
    centers[i] = lo + span * (i + 0.5) / bins;
    wt[i] = hist[i] / count;
    mu += wt[i] * centers[i];
  }
  let bestEta = -1, bestT = centers[0], w0 = 0, mu0 = 0;
  for (let i = 0; i < bins; i++) {
    w0 += wt[i]; mu0 += wt[i] * centers[i];
    if (w0 <= 1e-6 || w0 >= 1 - 1e-6) continue;
    const m0 = mu0 / w0, m1 = (mu - mu0) / (1 - w0);
    const dm = m0 - m1, eta = w0 * (1 - w0) * dm * dm;
    if (eta > bestEta) { bestEta = eta; bestT = centers[i]; }
  }
  let mean = 0;
  for (let i = 0; i < n; i++) if (vals[i] === vals[i]) mean += vals[i];
  mean /= count;
  let vr = 0;
  for (let i = 0; i < n; i++) {
    const v = vals[i];
    if (v !== v) continue;
    const d = v - mean; vr += d * d;
  }
  vr /= count;
  return {t: bestT, eta: vr > 1e-12 ? bestEta / vr : -1};
}

// How well the pose explains the sampled cells.
//
// With repeat > 1 the score is the fraction of logical bits whose copies all
// read the same. Sample bimodality cannot see the absolute rotation: turning
// the grid slides each ring tangentially, so every cell still lands on either a
// seed or bare dough and the samples stay just as bimodal -- an aliased
// rotation can even out-score the true one. The copies of a logical bit sit in
// different sectors, so a rotation shifts each of them by a different number of
// cells and their agreement collapses. That makes this the score that actually
// pins the rotation.
//
// A repeat=1 tier has no copies, so agreement is identically 1 and says
// nothing. Such a tier falls back to bimodality, which at least ranks the rest
// of the pose; its rotation is recovered by decoding a full turn instead (see
// cameraPoseCandidates).
function alignScore(img, w, h, prm) {
  projectAll(prm);
  const vals = CAM.vals, bits = CAM.bits, copies = CAM.copies;
  sampleCells(img, w, h, vals);
  const o = otsuF(vals);
  if (!o) return -1;
  const repeat = CAM.repeat;
  if (repeat <= 1) return o.eta;
  const thr = o.t;
  const n = CAM.n, nLogical = CAM.nLogical;
  for (let i = 0; i < n; i++) {
    const v = vals[i];
    bits[i] = v === v ? (v > thr ? 1 : 0) : -1;
  }
  let agree = 0, tot = 0;
  for (let g = 0; g < nLogical; g++) {
    const base = g * repeat;
    let mn = 2, mx = -2, finite = true;
    for (let r = 0; r < repeat; r++) {
      const b = bits[copies[base + r]];
      if (b < 0) { finite = false; break; }
      if (b < mn) mn = b;
      if (b > mx) mx = b;
    }
    if (!finite) continue;
    tot++;
    if (mn === mx) agree++;
  }
  return tot < 64 ? -1 : agree / tot;
}

// ============================================================
// Density-tier measurement
// ============================================================

// Resample the response onto (radius, arc length) rows. In these coordinates
// the seed lattice is a straight brick pattern, so the tangential period of a
// row is exactly the cell pitch in pixels. Radial structure cannot be used for
// this: a seed is ~10*merge px long on a 9*merge px ring pitch, so consecutive
// rings overlap and the radial profile carries no period.
function polarRows(resp, w, h, cx, cy, scale, r0, r1, rowStride) {
  if (r0 === undefined) r0 = 172.0;
  if (r1 === undefined) r1 = 464.0;
  if (rowStride === undefined) rowStride = 2;
  const rows = [];
  let r = Math.round(r0 * scale);
  const rEnd = Math.round(r1 * scale);
  const wLim = w - 1, hLim = h - 1;
  while (r < rEnd) {
    const n = Math.max(8, Math.trunc(2 * Math.PI * r));
    const row = new Float64Array(n);
    const invR = 1 / r;
    for (let i = 0; i < n; i++) {
      const th = i * invR;
      // Truncate toward zero then clamp, which is what the Python side's
      // .astype(int64) followed by np.clip does.
      let x = (cx + r * Math.cos(th)) | 0;
      let y = (cy + r * Math.sin(th)) | 0;
      if (x < 0) x = 0; else if (x > wLim) x = wLim;
      if (y < 0) y = 0; else if (y > hLim) y = hLim;
      row[i] = resp[y * w + x];
    }
    rows.push(row);
    r += rowStride;
  }
  return rows;
}

// Tangential autocorrelation of the polar rows, per lag in pixels.
function polarAc(resp, w, h, cx, cy, scale) {
  const rows = polarRows(resp, w, h, cx, cy, scale);
  if (rows.length < 8) return null;
  let n = Infinity;
  for (const r of rows) if (r.length < n) n = r.length;
  if (n < 24) return null;
  const nr = rows.length;
  const P = new Float64Array(nr * n);
  for (let k = 0; k < nr; k++) {
    const row = rows[k];
    let mean = 0;
    for (let i = 0; i < n; i++) mean += row[i];
    mean /= n;
    const o = k * n;
    for (let i = 0; i < n; i++) P[o + i] = row[i] - mean;
  }
  const lagMax = Math.trunc(40.0 * scale) + 2;
  const ac = new Float64Array(lagMax);
  for (let d = 1; d <= lagMax; d++) {
    let suu = 0, svv = 0, suv = 0, cnt = 0;
    for (let k = 0; k < nr; k++) {
      const o = k * n;
      for (let i = 0; i < n - d; i++) {
        const u = P[o + i], v = P[o + d + i];
        suu += u * u; svv += v * v; suv += u * v; cnt++;
      }
    }
    if (!cnt) continue;
    const den = Math.sqrt((suu / cnt) * (svv / cnt));
    ac[d - 1] = den > 1e-9 ? (suv / cnt) / den : 0.0;
  }
  return ac;
}

// Read the density tier off the image: the autocorrelation revives at the cell
// pitch (9*merge*scale px), because seeds are narrower than their spacing.
// Returns null when the response is too degraded to show a period.
function estimateMerge(resp, w, h, cx, cy, scale) {
  const ac = polarAc(resp, w, h, cx, cy, scale);
  if (!ac) return null;
  let pitch = null;
  for (let i = 1; i < ac.length - 1; i++) {
    if (ac[i] > 0.25 && ac[i] >= ac[i-1] && ac[i] >= ac[i+1]) { pitch = i + 1; break; }
  }
  if (pitch === null) return null;
  const merge = Math.round(pitch / (9.0 * scale));
  if (merge < 1 || merge > 4) return null;
  return merge;
}

// Scale from the seed pitch itself, sub-pixel.
//
// The rim conic reads the seed band's edge, which on a coarse tier is made of
// few big blobs and comes out biased inward by 1.5-3% even once it is blurred
// and iterated -- outside the pose refinement basin, and enough to let a
// rotated alias out-score the true orientation. The pitch is a direct ruler
// instead: interpolate the autocorrelation peak to sub-pixel and divide by the
// canonical pitch. Only used for merge >= 2, where the period is long enough
// for the interpolation to beat the conic.
function measurePitchScale(resp, w, h, cx, cy, scale, merge) {
  const ac = polarAc(resp, w, h, cx, cy, scale);
  if (!ac) return null;
  const guess = 9.0 * merge * scale;
  const lo = Math.max(2, Math.round(guess * 0.7));
  const hi = Math.min(ac.length - 1, Math.round(guess * 1.3));
  if (lo > hi) return null;
  // Strict `>` keeps the first of equal maxima, matching Python's max().
  let best = lo;
  for (let i = lo + 1; i <= hi; i++) if (ac[i] > ac[best]) best = i;
  if (best < 1 || best >= ac.length - 1 || ac[best] < 0.15) return null;
  const a = ac[best-1], b = ac[best], c = ac[best+1];
  const den = a - 2*b + c;
  let off = Math.abs(den) > 1e-9 ? 0.5*(a-c)/den : 0.0;
  if (off < -1.0 || off > 1.0) off = 0.0;
  return (best + 1 + off) / (9.0 * merge);
}

// Scale and center for a coarse tier, measured off the seed lattice.
//
// No centroid of the seed band can work here. The lattice itself is exactly
// centered -- the per-tier grid centroid offset is zero on all four tiers -- so
// the bias comes from which cells happen to carry a seed, i.e. from the
// payload. That puts the band centroid off the true center by about
// R/sqrt(N/2): ~3 px at m=1 growing to ~13 px at m=4, and measured worst case
// 10.6 px on tier 3 no matter the weighting. The rim, by contrast, is a circle
// and so is payload-independent.
//
// The rim only fails on a coarse tier because it is sampled by a few hundred
// big blobs, which reads as a bumpy outline: an unblurred fit comes back 5.7 px
// out with a 0.85 squeeze on a frontal shot. Blurring the energy by three
// quarters of a cell pitch welds the blobs into a continuous ring, and
// re-fitting from the fit's own center makes it a fixed point. Measured over
// four tiers x rolls 0/15/30/45 x a native and a half-resolution view, that
// lands the center within 2.9 px worst case and 1.4 px on every tier below
// m=4; half a pitch leaves the ring too bumpy at m=4 (7.4 px) and a full pitch
// overshoots into the hole.
//
// Scale still comes from the pitch, not the rim: the blurred rim reads inward
// by up to ~3%, and the spread depends on the view's sharpness in a way the
// pitch does not. Re-measuring the pitch from the converged center halves its
// error, worst case 0.36% against 0.9% from the small-kernel start.
//
// Runs per tier rather than once in frontEndParams, because merge detection is
// only a guess used to order the sweep -- a coarse tier whose pitch peak fell
// below the estimator's threshold still needs these corrections.
function coarseGeometry(fe, prm, merge) {
  const wide = fe.wide, aw = fe.aw, ah = fe.ah, f = fe.f;
  let cx = prm.cx * f, cy = prm.cy * f, scale = prm.scale * f;
  let ps = measurePitchScale(wide, aw, ah, cx, cy, scale, merge);
  if (ps !== null) scale = ps;
  const outerR = getRingParams(DEFAULT_IMAGE_SIZE).outer_r;
  const rad = Math.max(1, Math.round(0.75 * SESAME_SPACING * merge * scale));
  const sq = new Float64Array(aw * ah);
  for (let i = 0; i < sq.length; i++) sq[i] = wide[i] * wide[i];
  const e = boxBlurF(sq, aw, ah, rad);
  for (let k = 0; k < 3; k++) {
    const c = edgeConic(e, aw, ah, cx, cy,
                        0.60 * scale * outerR, 1.40 * scale * outerR, true);
    if (!c) break;
    cx = c.cx; cy = c.cy;
  }
  ps = measurePitchScale(wide, aw, ah, cx, cy, scale, merge);
  const out = clonePose(prm);
  out.cx = cx / f; out.cy = cy / f;
  // The blur that welds the rim into a ring also biases the fitted ellipse: on
  // a dead-frontal coarse-tier shot it reads an aspect of 0.97-0.99, and a
  // percent or two of squeeze along a random axis costs more alignment than
  // any real tilt it could explain. Coarse tiers start level and leave the tilt
  // to the pose refinement.
  out.aspect = 1.0; out.theta = 0.0;
  // The keystone has to go too, and for a sharper reason: it is inherited from
  // localizeDisc, whose small-kernel map cancels a coarse tier's seeds and
  // reports a 0.71-0.89 squeeze on a frontal shot. That fake tilt sends
  // fitPoseConics after keystone terms of up to 0.10, which compress one side
  // of the grid by 10% -- five cell pitches at m=2, against a basin of a few
  // pixels of center and a percent of scale. Nothing decodes from there, at any
  // rotation.
  out.kx = 0.0; out.ky = 0.0;
  if (ps !== null) { scale = ps; out.scale = scale / f; }
  return {prm: out, pitchScale: ps !== null};
}

// Tiers to try, nearest to the measured pitch first. The header tier still has
// to agree before a payload is accepted, so a wrong guess only costs time,
// never correctness.
function tierOrder(merge) {
  if (merge === null || merge === undefined) return TIER_IDS.slice();
  const est = merge - 1;
  return TIER_IDS.slice().sort((a, b) => (Math.abs(a - est) - Math.abs(b - est)) || (a - b));
}

// Conic through the steepest radial transition of the seed energy between
// rLo and rHi, taken per angle bin: descent finds the outer rim, ascent the
// hole edge.
function edgeConic(e, w, h, cx, cy, rLo, rHi, descent) {
  const span = rHi - rLo;
  if (span <= 1.0) return null;
  const nb = 360, nsh = 64;
  const S = new Float64Array(nb * nsh), C = new Float64Array(nb * nsh);
  const x0 = Math.max(0, Math.floor(cx - rHi)), x1 = Math.min(w - 1, Math.ceil(cx + rHi));
  const y0 = Math.max(0, Math.floor(cy - rHi)), y1 = Math.min(h - 1, Math.ceil(cy + rHi));
  const invSpan = nsh / span, inv2pi = nb / (2 * Math.PI);
  for (let y = y0; y <= y1; y++) {
    const dy = y - cy, dy2 = dy * dy, o = y * w;
    for (let x = x0; x <= x1; x++) {
      const dx = x - cx;
      const r = Math.sqrt(dx * dx + dy2);
      // Truncate toward zero, not floor: a radius just inside rLo lands in
      // shell 0, which is what the Python side does. `| 0` truncates toward
      // zero on both sides of the origin, so it covers the ceil branch too.
      const sh = ((r - rLo) * invSpan) | 0;
      if (sh < 0 || sh >= nsh) continue;
      let bi = ((Math.atan2(dy, dx) + Math.PI) * inv2pi) | 0;
      if (bi < 0) bi = 0; else if (bi > nb - 1) bi = nb - 1;
      const idx = bi * nsh + sh;
      S[idx] += e[o + x]; C[idx] += 1;
    }
  }

  const P = new Float64Array(nb * nsh);
  for (let b = 0; b < nb; b++) {
    const o = b * nsh;
    let mx = 0;
    for (let j = 0; j < nsh; j++) {
      const v = S[o + j] / Math.max(C[o + j], 1);
      P[o + j] = v;
      if (v > mx) mx = v;
    }
    // Normalise each angle bin by its own peak: under tilt the far side is
    // compressed and its gradient is proportionally shallower.
    const k = 1 / Math.max(mx, 1e-9);
    for (let j = 0; j < nsh; j++) P[o + j] *= k;
  }

  const Ps = new Float64Array(nb * nsh);
  for (let b = 0; b < nb; b++) {
    const o = b * nsh;
    for (let j = 0; j < nsh; j++) {
      let s = 3 * P[o + j];
      if (j > 0) { s += 2 * P[o + j - 1]; if (j > 1) s += P[o + j - 2]; }
      if (j < nsh - 1) { s += 2 * P[o + j + 1]; if (j < nsh - 2) s += P[o + j + 2]; }
      Ps[o + j] = s / 9;
    }
  }

  const nd = nsh - 1;
  const dP = new Float64Array(nb * nd);
  for (let b = 0; b < nb; b++) {
    const o = b * nsh, od = b * nd;
    for (let j = 0; j < nd; j++) dP[od + j] = Ps[o + j + 1] - Ps[o + j];
  }
  const jj = new Int32Array(nb), depth = new Float64Array(nb);
  for (let b = 0; b < nb; b++) {
    const od = b * nd;
    let best = 0, bv = dP[od];
    for (let j = 1; j < nd; j++) {
      const v = dP[od + j];
      if (descent ? v < bv : v > bv) { bv = v; best = j; }
    }
    jj[b] = best; depth[b] = Math.abs(bv);
  }
  const sorted = Float64Array.from(depth).sort();
  const cutoff = 0.20 * percentileSortedF(sorted, 70);
  const seen = new Uint8Array(12);
  let ngood = 0;
  for (let b = 0; b < nb; b++) if (depth[b] > cutoff) { ngood++; seen[(b / 30) | 0] = 1; }
  if (ngood < 200) return null;
  let nsec = 0;
  for (let s = 0; s < 12; s++) nsec += seen[s];
  if (nsec < 10) return null;

  const xs = [], ys = [];
  for (let b = 0; b < nb; b++) {
    if (depth[b] <= cutoff) continue;
    const od = b * nd, j = jj[b];
    const jl = j - 1 < 0 ? 0 : j - 1;
    const jh = j + 1 > nd - 1 ? nd - 1 : j + 1;
    const d0 = dP[od + jl], d1 = dP[od + j], d2 = dP[od + jh];
    const den = d0 - 2 * d1 + d2;
    let sub = Math.abs(den) > 1e-9 ? 0.5 * (d0 - d2) / den : 0;
    sub = sub < -1 ? -1 : (sub > 1 ? 1 : sub);
    const re = rLo + span * (j + 0.5 + sub) / nsh;
    const tb = (b + 0.5) / nb * 2 * Math.PI - Math.PI;
    xs.push(cx + re * Math.cos(tb));
    ys.push(cy + re * Math.sin(tb));
  }
  return conicFit(xs, ys);
}

function conicOfCircle(prm, radius) {
  const n = 90, xs = new Float64Array(n), ys = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const t = 2 * Math.PI * i / n;
    const p = projectPoint(prm, radius * Math.cos(t), radius * Math.sin(t));
    xs[i] = p[0]; ys[i] = p[1];
  }
  return conicFit(xs, ys);
}

// Two concentric canonical circles (seed rim, hole edge) project to the two
// observed conics. Matching them recovers center, scale, tilt and keystone
// together, including the perspective offset between a conic's center and the
// projected grid center, which is exactly what makes a rim-only estimate
// drift under tilt.
function fitPoseConics(outer, hole, prmIn) {
  const targets = [];
  if (outer) targets.push([CANON_RIM_R, outer]);
  if (hole) targets.push([CANON_HOLE_R, hole]);
  const best = clonePose(prmIn);
  if (!targets.length) return best;

  function cost(p) {
    let tot = 0;
    for (let ti = 0; ti < targets.length; ti++) {
      const radius = targets[ti][0], obs = targets[ti][1];
      const c = conicOfCircle(p, radius);
      if (!c) return 1e6;
      const dcx = c.cx - obs.cx, dcy = c.cy - obs.cy;
      tot += (dcx * dcx + dcy * dcy) / 4;
      const da = c.a - obs.a;
      tot += (da / 3) * (da / 3);
      // A near-circular conic carries no axis information, and the small hole
      // conic is too noisy for it: take squeeze and its direction only from a
      // clearly eccentric outer rim.
      const w = radius < 300 ? 0 : Math.min(Math.max((1 - obs.asp) / 0.05, 0), 1);
      const dAsp = c.asp - obs.asp;
      tot += w * (dAsp / 0.01) * (dAsp / 0.01);
      const dpsi = pymod(c.psi - obs.psi + Math.PI / 2, Math.PI) - Math.PI / 2;
      tot += w * (dpsi / 0.05) * (dpsi / 0.05);
    }
    return tot;
  }

  const keys = ['cx', 'cy', 'scale', 'aspect', 'theta', 'kx', 'ky'];
  const nk = keys.length;
  const steps = [4.0, 4.0, 0.02 * best.scale, 0.03, 0.08, 0.10, 0.10];
  function fvec(v) {
    const p = clonePose(best);
    for (let i = 0; i < nk; i++) p[keys[i]] = v[i];
    p.aspect = Math.min(Math.max(p.aspect, 0.3), 1.0);
    return cost(p);
  }
  // Nelder-Mead: keystone and center trade off against each other, a valley
  // coordinate descent cannot follow.
  const sim = [], fv = [];
  const base = keys.map(k => best[k]);
  sim.push(base.slice());
  for (let i = 0; i < nk; i++) { const v = base.slice(); v[i] += steps[i]; sim.push(v); }
  for (let i = 0; i <= nk; i++) fv.push(fvec(sim[i]));
  const order = new Array(nk + 1);
  for (let it = 0; it < 160; it++) {
    for (let i = 0; i <= nk; i++) order[i] = i;
    order.sort((a, b) => fv[a] - fv[b]);
    const ns = order.map(i => sim[i]), nf = order.map(i => fv[i]);
    for (let i = 0; i <= nk; i++) { sim[i] = ns[i]; fv[i] = nf[i]; }
    if (fv[nk] - fv[0] < 1e-7) break;
    const cen = new Array(nk).fill(0);
    for (let i = 0; i < nk; i++) for (let j = 0; j < nk; j++) cen[j] += sim[i][j];
    for (let j = 0; j < nk; j++) cen[j] /= nk;
    const worst = sim[nk];
    const xr = cen.map((c, j) => c + (c - worst[j]));
    const fr = fvec(xr);
    if (fr < fv[0]) {
      const xe = cen.map((c, j) => c + 2 * (c - worst[j]));
      const fe = fvec(xe);
      if (fe < fr) { sim[nk] = xe; fv[nk] = fe; } else { sim[nk] = xr; fv[nk] = fr; }
    } else if (fr < fv[nk - 1]) {
      sim[nk] = xr; fv[nk] = fr;
    } else {
      const xc = cen.map((c, j) => c + 0.5 * (worst[j] - c));
      const fc = fvec(xc);
      if (fc < fv[nk]) { sim[nk] = xc; fv[nk] = fc; }
      else {
        for (let i = 1; i <= nk; i++) {
          const s0 = sim[0], si = sim[i];
          const nv = new Array(nk);
          for (let j = 0; j < nk; j++) nv[j] = s0[j] + 0.5 * (si[j] - s0[j]);
          sim[i] = nv; fv[i] = fvec(nv);
        }
      }
    }
  }
  let bo = 0;
  for (let i = 1; i <= nk; i++) if (fv[i] < fv[bo]) bo = i;
  for (let i = 0; i < nk; i++) best[keys[i]] = sim[bo][i];
  best.aspect = Math.min(Math.max(best.aspect, 0.3), 1.0);
  return best;
}

// Find the seed disc in the top-hat energy map: its centroid is the code
// center, its RMS radius the scale, and its inertia the tilt axis and aspect.
// Brightness, shading and background texture are already gone from resp, so
// the disc is the only large structure left.
function localizeDisc(resp, w, h) {
  const n = w * h;
  const rad = Math.max(3, Math.round(Math.min(h, w) / 90));
  const sq = new Float64Array(n);
  for (let i = 0; i < n; i++) sq[i] = resp[i] * resp[i];
  const e = boxBlurF(sq, w, h, rad);
  let emax = 0;
  for (let i = 0; i < n; i++) if (e[i] > emax) emax = e[i];
  if (!(emax > 0)) return null;
  const thrE = 0.25 * emax;

  let nIn = 0, tot = 0;
  for (let i = 0; i < n; i++) { tot += e[i]; if (e[i] > thrE) nIn++; }
  if (nIn < 300 || nIn >= n) return null;
  const ixs = new Int32Array(nIn), iys = new Int32Array(nIn), wts = new Float64Array(nIn);
  let k = 0, sumIn = 0;
  for (let i = 0; i < n; i++) {
    if (e[i] > thrE) {
      ixs[k] = i % w; iys[k] = (i / w) | 0; wts[k] = e[i];
      sumIn += e[i]; k++;
    }
  }
  const contrast = (sumIn / nIn) / ((tot - sumIn) / (n - nIn) + 1e-9);
  if (contrast < 2.5) return null;

  let cx = 0, cy = 0;
  for (let i = 0; i < nIn; i++) { cx += ixs[i]; cy += iys[i]; }
  cx /= nIn; cy /= nIn;
  let rms = 0;
  for (let i = 0; i < nIn; i++) {
    const dx = ixs[i] - cx, dy = iys[i] - cy;
    rms += dx * dx + dy * dy;
  }
  rms = Math.sqrt(rms / nIn);

  let keep = null;
  for (let it = 0; it < 3; it++) {
    // Re-center on the disc alone: background speckle that survived the
    // threshold would otherwise drag the centroid several pixels, which is
    // enough to flatten the scale landscape later on.
    const rl = 1.5 * rms, rl2 = rl * rl;
    const ks = [];
    for (let i = 0; i < nIn; i++) {
      const dx = ixs[i] - cx, dy = iys[i] - cy;
      if (dx * dx + dy * dy <= rl2) ks.push(i);
    }
    if (ks.length < 300) return null;
    keep = ks;
    let sv = 0, sx = 0, sy = 0;
    for (let a = 0; a < ks.length; a++) {
      const i = ks[a], wk = wts[i];
      sv += wk; sx += ixs[i] * wk; sy += iys[i] * wk;
    }
    cx = sx / sv; cy = sy / sv;
    let s2 = 0;
    for (let a = 0; a < ks.length; a++) {
      const i = ks[a], dx = ixs[i] - cx, dy = iys[i] - cy;
      s2 += dx * dx + dy * dy;
    }
    rms = Math.sqrt(s2 / ks.length);
  }
  if (!keep) return null;

  let sv = 0, mu20 = 0, mu02 = 0, mu11 = 0;
  for (let a = 0; a < keep.length; a++) {
    const i = keep[a], wk = wts[i];
    const dx = ixs[i] - cx, dy = iys[i] - cy;
    sv += wk; mu20 += wk * dx * dx; mu02 += wk * dy * dy; mu11 += wk * dx * dy;
  }
  mu20 /= sv; mu02 /= sv; mu11 /= sv;
  const tr = mu20 + mu02, det = mu20 * mu02 - mu11 * mu11;
  const sqd = Math.sqrt(Math.max(tr * tr / 4 - det, 0));
  const l1 = tr / 2 + sqd, l2 = Math.max(tr / 2 - sqd, 1e-9);
  const cp = getRingParams(DEFAULT_IMAGE_SIZE);
  // Area-uniform annulus between inner_r and outer_r: E[r^2]=(R^2+r0^2)/2
  const rmsNorm = Math.sqrt((cp.outer_r * cp.outer_r + cp.inner_r * cp.inner_r) / 2);
  let scale = Math.sqrt(Math.max(tr, 1e-9)) / rmsNorm;
  if (scale <= 1e-6) return null;
  let aspect = Math.sqrt(l2 / l1);
  let theta = 0.5 * Math.atan2(2 * mu11, mu20 - mu02);
  const rGuess = scale * cp.outer_r;

  // The edge conic wants an unsmoothed energy map: the box blur that steadies
  // the centroid pushes the steepest-descent edge outward by roughly two
  // thirds of its radius, which is a 2-4% scale error on a small bagel and
  // far outside the alignment capture basin.
  const eEdge = boxBlurF(sq, w, h, Math.max(1, Math.round(Math.min(h, w) / 280)));
  const outerC = edgeConic(eEdge, w, h, cx, cy, 0.60 * rGuess, 1.40 * rGuess, true);
  const holeC = edgeConic(eEdge, w, h, cx, cy, 0.15 * rGuess, 0.55 * rGuess, false);
  let kx = 0, ky = 0;
  if (outerC) {
    const rScale = outerC.a / CANON_RIM_R;
    if (0.6 * scale < rScale && rScale < 1.4 * scale) {
      cx = outerC.cx; cy = outerC.cy; scale = rScale;
      aspect = outerC.asp; theta = outerC.psi;
    }
    if (aspect < 0.985) {
      // Only worth the full pose fit under real tilt: the projected grid
      // center stops coinciding with the rim ellipse's center, and the
      // keystone terms are the only thing that can absorb the gap. Frontal
      // shots are better served by the rim conic alone -- the hole conic is
      // small and its edge sits several pixels outside the true hole, so
      // pulling it into the fit inflates the scale past the alignment basin.
      const pose = fitPoseConics(outerC, holeC,
                                 {cx, cy, scale, aspect, theta, phi: 0, kx: 0, ky: 0});
      cx = pose.cx; cy = pose.cy; scale = pose.scale;
      aspect = pose.aspect; theta = pose.theta; kx = pose.kx; ky = pose.ky;
    }
  }
  if (aspect > 0.985) {
    // Tilt below ~17 degrees is not worth modelling, and any residual squeeze
    // at that level is fit noise: a 1% squeeze along a random axis costs more
    // alignment than it explains.
    aspect = 1.0; theta = 0.0;
  }
  return {prm: {cx, cy, scale, aspect: Math.min(Math.max(aspect, 0.3), 1.0),
                theta, phi: 0, kx, ky}, contrast};
}

// Copy agreement dies outside roughly +-3px of center and +-1% of scale, but
// a bagel pushed toward the frame edge localizes 15px out, so the rounds
// start wide and narrow from there.
const COARSE_ROUNDS = [
  [8.0, 4.0, 0.06],
  [4.0, 2.0, 0.04],
  [2.0, 1.0, 0.02],
  [1.0, 0.5, 0.01],
  [0.5, 0.25, 0.004]
];

// Snap the disc-moment pose onto the alignment optimum.
//
// Center and scale are searched jointly rather than one axis at a time,
// because at this resolution a center error can only be paid for by a scale
// error and vice versa.
//
// Rotation and geometry have to be ordered, and which order works depends on
// which of the two the localization got wrong. Shot straight on, the center
// lands within a pixel or two, so the rotation scan is already meaningful and
// picks up the roll at once. Pushed toward the frame edge the center lands
// several pixels out, and then the rotation scan is worse than useless: a
// couple of pixels of center error already moves the agreement argmax tens of
// degrees, so it locks onto an alias and the geometry search that follows has
// no basin left to find. So scan rotation first, and only when that lands
// somewhere poor fall back to fixing the geometry first.
function coarsePose(resp, w, h, prmIn, kPhi, slack) {
  if (kPhi === undefined) kPhi = 3;
  if (slack === undefined) slack = [0.85, 1.18];
  const s0 = prmIn.scale;
  const lo = slack[0] * s0, hiS = slack[1] * s0;
  // The ring grid is radially self-similar, so half/double scale also lands
  // on seeds; the disc radius from localizeDisc rules those harmonics out.
  function trySet(base, ov) {
    const p = clonePose(base);
    for (const key in ov) p[key] = ov[key];
    p.aspect = Math.min(Math.max(p.aspect, 0.3), 1.0);
    p.scale = Math.min(Math.max(p.scale, lo), hiS);
    return {p, s: alignScore(resp, w, h, p)};
  }
  function geomRounds(start, score) {
    let best = clonePose(start);
    for (let i = 0; i < COARSE_ROUNDS.length; i++) {
      const crange = COARSE_ROUNDS[i][0], cstep = COARSE_ROUNDS[i][1], srange = COARSE_ROUNDS[i][2];
      const offs = arangeF(-crange, crange + 1e-9, cstep);
      for (let a = 0; a < offs.length; a++) {
        for (let b = 0; b < offs.length; b++) {
          const r = trySet(best, {cx: best.cx + offs[a], cy: best.cy + offs[b]});
          if (r.s > score) { score = r.s; best = r.p; }
        }
      }
      const ms = linspaceF(1 - srange, 1 + srange, 9);
      for (let a = 0; a < ms.length; a++) {
        const r = trySet(best, {scale: best.scale * ms[a]});
        if (r.s > score) { score = r.s; best = r.p; }
      }
      if (i === 1) {
        // Aspect and its axis are coupled: a compression along the wrong axis
        // scores worse than none at all. Swept once the widest center round
        // has landed, not before -- at a bad center a squeeze can only
        // compensate for the offset and the pair then locks together.
        const asps = [0.70, 0.80, 0.88, 0.94, 1.0];
        const ths = arangeF(0, Math.PI, Math.PI / 8);
        for (let a = 0; a < asps.length; a++)
          for (let b = 0; b < ths.length; b++) {
            const r = trySet(best, {aspect: asps[a], theta: ths[b]});
            if (r.s > score) { score = r.s; best = r.p; }
          }
      }
    }
    return {best, score};
  }
  function rotateThenGeom(start) {
    let best = clonePose(start);
    let score = alignScore(resp, w, h, best);
    for (const pk of phiPeaks(resp, w, h, best, 1.0, 0.25, kPhi, 20.0)) {
      const g = geomRounds(pk.prm, alignScore(resp, w, h, pk.prm));
      if (g.score > score) { best = g.best; score = g.score; }
    }
    return {best, score};
  }

  let out = rotateThenGeom(prmIn);
  if (out.score < 0.8) {
    const gf = geomRounds(prmIn, alignScore(resp, w, h, prmIn));
    let alt = rotateThenGeom(gf.best);
    if (gf.score > alt.score) alt = gf;
    if (alt.score > out.score) out = alt;
  }
  return out;
}

// Step sizes stay inside the measured tolerances: scale +-0.5%, center
// +-1.5px, aspect +-0.01, keystone +-0.03, rotation +-0.3deg. Coarser sweeps
// drift past the optimum because the alignment score is flat and noisy there.
const DESCENT_ROUNDS = [
  [['scale', linspaceF(0.994, 1.006, 9), true],
   ['cx', arangeF(-1.5, 1.51, 0.5), false],
   ['cy', arangeF(-1.5, 1.51, 0.5), false],
   ['aspect', arangeF(-0.012, 0.0121, 0.003), false],
   ['theta', arangeF(-0.024, 0.0241, 0.006), false],
   ['kx', arangeF(-0.06, 0.061, 0.015), false],
   ['ky', arangeF(-0.06, 0.061, 0.015), false]],
  [['scale', linspaceF(0.9985, 1.0015, 7), true],
   ['cx', arangeF(-0.4, 0.41, 0.2), false],
   ['cy', arangeF(-0.4, 0.41, 0.2), false],
   ['aspect', arangeF(-0.004, 0.0041, 0.001), false],
   ['theta', arangeF(-0.008, 0.0081, 0.002), false],
   ['kx', arangeF(-0.02, 0.021, 0.005), false],
   ['ky', arangeF(-0.02, 0.021, 0.005), false]]
];

// Residual geometry error the descent can still leave behind; the real
// decoder arbitrates over these variants.
const GEOM_VARIANTS = [
  {},
  {scale: 1.0025}, {scale: 0.9975},
  {cx: 0.6}, {cx: -0.6}, {cy: 0.6}, {cy: -0.6},
  {aspect: 0.004}, {aspect: -0.004},
  {kx: 0.02}, {ky: 0.02}, {kx: -0.02}, {ky: -0.02}
];

// A coarse tier's scale comes from the seed pitch, which is good to well under
// 1% -- but only when the autocorrelation peak clears its guard. When it does
// not, the rim conic is the fallback and reads inward by 1.5-3%, outside the
// refinement basin. Extra scale variants cover that fallback; m=1 keeps the
// tight set because its conic is already accurate.
//
// Rotation variants are coarse-tier only for the same reason. Fewer cells per
// ring means a given rotation shifts each ring by a smaller fraction of its
// pitch, so the agreement peak sits closer to the truth but the window that
// actually decodes narrows to ~2 deg -- and the peak can land a degree outside
// it.
const COARSE_GEOM_VARIANTS = [
  {scale: 1.02}, {scale: 0.98}, {scale: 1.04}, {scale: 0.96},
  {scale: 1.06}, {scale: 0.94},
  {phi: -2.0 * Math.PI / 180}, {phi: -1.5 * Math.PI / 180},
  {phi: -1.0 * Math.PI / 180}, {phi: -0.5 * Math.PI / 180},
  {phi: 0.5 * Math.PI / 180}, {phi: 1.0 * Math.PI / 180},
  {phi: 1.5 * Math.PI / 180}, {phi: 2.0 * Math.PI / 180}
];

function geomVariants(merge) {
  return merge <= 1 ? GEOM_VARIANTS : GEOM_VARIANTS.concat(COARSE_GEOM_VARIANTS);
}

function descendPose(resp, w, h, prmIn, scoreIn) {
  let prm = clonePose(prmIn), score = scoreIn;
  for (const spec of DESCENT_ROUNDS) {
    for (const [key, deltas, mult] of spec) {
      for (let i = 0; i < deltas.length; i++) {
        const p = clonePose(prm);
        p[key] = mult ? prm[key] * deltas[i] : prm[key] + deltas[i];
        if (key === 'aspect') p[key] = Math.min(Math.max(p[key], 0.3), 1.0);
        const s = alignScore(resp, w, h, p);
        if (s > score) { score = s; prm = p; }
      }
    }
  }
  return {prm, score};
}

function phiScan(resp, w, h, prm, degStep) {
  const out = [];
  const n = Math.max(0, Math.ceil((360.0 - 0.0) / degStep));
  for (let i = 0; i < n; i++) {
    const p = clonePose(prm);
    p.phi = i * degStep * Math.PI / 180;
    out.push({score: alignScore(resp, w, h, p), deg: i * degStep});
  }
  out.sort((a, b) => b.score - a.score);
  return out;
}

function phiPeaks(resp, w, h, prm, degStep, fineStep, kPeaks, sepDeg) {
  const peaks = [], chosen = [];
  for (const cand of phiScan(resp, w, h, prm, degStep)) {
    let clash = false;
    for (const o of chosen) {
      const d = Math.abs(cand.deg - o);
      if (Math.min(d, 360 - d) < sepDeg) { clash = true; break; }
    }
    if (clash) continue;
    const local = [{score: cand.score, deg: cand.deg}];
    const n = Math.max(0, Math.ceil((2 * degStep + 1e-9) / fineStep));
    for (let i = 0; i < n; i++) {
      const deg = pymod(cand.deg - degStep + i * fineStep, 360);
      const p = clonePose(prm);
      p.phi = deg * Math.PI / 180;
      local.push({score: alignScore(resp, w, h, p), deg});
    }
    local.sort((a, b) => b.score - a.score);
    const p = clonePose(prm);
    p.phi = local[0].deg * Math.PI / 180;
    peaks.push({score: local[0].score, prm: p});
    chosen.push(local[0].deg);
    if (peaks.length >= kPeaks) break;
  }
  peaks.sort((a, b) => b.score - a.score);
  return peaks;
}

// Find the in-plane rotation, then tighten the rest of the pose.
//
// coarsePose has already put the center and scale inside the agreement basin,
// so the rotation scan is now meaningful: it runs at 1deg, coarse enough to
// bracket the peak since agreement is already down to ~0.5 half a degree out,
// and only then is the geometry descended and the rotation rescanned at
// 0.1deg. The top peaks are all returned, ranked, for the decoder to arbitrate.
function refinePose(resp, w, h, prmIn, kPeaks) {
  if (kPeaks === undefined) kPeaks = 3;
  const out = [];
  for (const pk of phiPeaks(resp, w, h, prmIn, 1.0, 0.1, kPeaks, 3.0)) {
    const d = descendPose(resp, w, h, pk.prm, pk.score);
    const fine = [{score: d.score, prm: d.prm}];
    const step = 0.05 * Math.PI / 180;
    const lo = d.prm.phi - 0.5 * Math.PI / 180;
    const n = Math.ceil((1.0 * Math.PI / 180 + 1e-12) / step);
    for (let i = 0; i < n; i++) {
      const p = clonePose(d.prm);
      p.phi = lo + i * step;
      fine.push({score: alignScore(resp, w, h, p), prm: p});
    }
    fine.sort((a, b) => b.score - a.score);
    out.push(fine[0], fine[1]);
  }
  out.sort((a, b) => b.score - a.score);
  return {best: out[0].prm, peaks: out};
}

// Hard 0/1 decisions plus an erasure band. The band comes from each mode's own
// spread (MAD), not from the gap between the modes: a gap-proportional band
// eats the whole tail of the broader mode and skews the vote, while MAD scales
// with the actual noise, so a blurry low-contrast shot widens it (more
// erasures for RS to use) and a clean one keeps almost every cell decisive.
//
// The cuts hang off the modes, not off the Otsu threshold. On a coarse tier the
// upper mode is broad enough that Otsu splits at the low edge of the gap, and a
// threshold-relative band then slides under the zero mode, turning every absent
// seed into an erasure.
function classifyCells(vals, hit) {
  const o = otsuF(vals);
  if (!o) return null;
  const thr = o.t;
  const below = [], above = [];
  for (let i = 0; i < vals.length; i++) {
    const v = vals[i];
    if (v !== v) continue;
    if (v < thr) below.push(v); else above.push(v);
  }
  if (below.length < 100 || above.length < 100) return null;
  const m0 = medianF(below), m1 = medianF(above);
  const gap = Math.abs(m1 - m0);
  if (gap <= 1e-6) return null;
  const a0 = new Float64Array(below.length), a1 = new Float64Array(above.length);
  for (let i = 0; i < below.length; i++) a0[i] = Math.abs(below[i] - m0);
  for (let i = 0; i < above.length; i++) a1[i] = Math.abs(above[i] - m1);
  const s0 = medianF(a0), s1 = medianF(a1);
  const floorV = 0.05 * gap;
  const loCut = m0 + Math.max(1.3 * s0, floorV);
  const hiCut = m1 - Math.max(1.3 * s1, floorV);
  if (loCut >= hiCut) return null;
  const n = vals.length;
  const out = new Array(n).fill(null);
  for (let i = 0; i < n; i++) {
    if (hit[i]) continue;
    const v = vals[i];
    if (v !== v) continue;
    if (v > hiCut) out[i] = 1;
    else if (v < loCut) out[i] = 0;
  }
  return out;
}

// Tier-independent half of the camera front end: localize the seed disc and
// read the density tier off the seed pitch. Returns null when there is no disc
// at all.
function frontEndParams(gray, w, h) {
  if (Math.min(h, w) < 40) return null;

  const f0 = ANALYZE_MAX_DIM / Math.max(h, w);
  let aGray, aw, ah, f;
  if (f0 < 1.0) {
    aw = Math.max(8, Math.round(w * f0));
    ah = Math.max(8, Math.round(h * f0));
    aGray = boxResizeF(gray, w, h, aw, ah);
    f = f0;
  } else {
    aGray = gray; aw = w; ah = h; f = 1.0;
  }

  // A k=25 map keeps every tier's seeds -- opening with a big kernel erases
  // small blobs too, so it passes them as well -- which is what the pitch
  // measurement needs. k=5 stays the localization default because it rejects
  // background texture a wide kernel would admit.
  const wide = tophatF(aGray, aw, ah, 25);
  const wideLoc = localizeDisc(wide, aw, ah);
  const narrowLoc = localizeDisc(tophatF(aGray, aw, ah, 5), aw, ah);
  const prm = narrowLoc ? narrowLoc.prm : (wideLoc ? wideLoc.prm : null);
  if (!prm) return null;

  // Merge detection only orders the tier sweep, so it is allowed to be wrong:
  // the header check rejects a mismatched tier and the sweep moves on. The
  // pitch lives in the wide map, so read it from that map's own localization
  // first -- a k=5 fit on a coarse tier cancels the seeds and comes back with a
  // center several pixels out, which is enough to hide the autocorrelation peak
  // and report the tier as m=1.
  let merge = null;
  for (const base of [wideLoc ? wideLoc.prm : null, prm]) {
    if (!base) continue;
    merge = estimateMerge(wide, aw, ah, base.cx, base.cy, base.scale);
    if (merge !== null) break;
  }
  if (merge === null) merge = 1;

  prm.cx /= f; prm.cy /= f; prm.scale /= f;
  return {gray, w, h, prm, merge, wide, aw, ah, f};
}

// Yields cell readings for ranked pose candidates; the caller decodes them in
// order and stops at the first payload whose header and SHA-256 check out.
function* cameraPoseCandidates(fe, tier) {
  const gray = fe.gray, w = fe.w, h = fe.h;
  const m = TIER_TABLE[tier][0];
  let prm = fe.prm, pitchScale = false;
  if (m > 1) {
    const cg = coarseGeometry(fe, prm, m);
    prm = cg.prm; pitchScale = cg.pitchScale;
  }

  // The top-hat kernel has to sit between the seed and the bagel's own texture:
  // smaller than a seed and it only reports the seed's outline, bigger than a
  // texture clump and the clump reads as a seed. At L0 that window is wide and
  // 12x the cell pitch sits in it. On a coarse tier the seed grows with the
  // merge but the texture does not, so the window closes from above -- at m=4
  // and native render resolution, 10x and 12x both admit texture and nothing
  // decodes at any rotation, while 6x and 8x do. Coarse tiers take the smaller
  // kernel.
  const thMult = m <= 1 ? 12.0 : 8.0;
  const thK = Math.max(3, Math.round(thMult * m * prm.scale));
  const resp = tophatF(gray, w, h, thK);
  // A quarter of the cell pitch: enough to average out grain inside a cell, and
  // it truncates to zero once cells are only a few pixels across, where any
  // blur at all smears seeds into their neighbours.
  const smRad = Math.min(Math.trunc(2.25 * m * prm.scale), 28);
  const respS = boxBlurF(resp, w, h, smRad);

  // A scale read off the seed pitch is good to well under 1%, so leave it
  // almost no room. The wide harmonic guard is what lets a coarse tier fail
  // here: agreement has aliases a couple of percent out, and from a center that
  // is a few pixels off the search pays for the offset with scale, locks the
  // pair together, and lands 2% out -- past the point where anything decodes.
  const slack = pitchScale ? [0.99, 1.01] : [0.85, 1.18];
  const geo = clonePose(prm);
  prm = coarsePose(respS, w, h, prm, 3, slack).best;

  const dmgRad = Math.max(2, Math.round(3.0 * prm.scale));
  let gmax = 0;
  for (let i = 0; i < gray.length; i++) if (gray[i] > gmax) gmax = gray[i];
  const wf = borderWhiteF(gray, w, h, Math.max(245.0, 0.98 * gmax));
  const dil = movExtremeF(Float64Array.from(wf), w, h, 2 * dmgRad + 1, false);

  const n = CAM.n, xs = CAM.xs, ys = CAM.ys;
  const vals = new Float64Array(n);
  const hit = new Uint8Array(n);
  const variants = geomVariants(m);

  // `vals`, `hit` and the projected coordinates are all reused across poses:
  // classifyCells copies out before the next call overwrites them.
  function reading(p) {
    projectAll(p);
    sampleCells(respS, w, h, vals);
    let nValid = 0;
    for (let i = 0; i < n; i++) if (vals[i] === vals[i]) nValid++;
    if (nValid < 0.35 * n) return null;
    for (let i = 0; i < n; i++) {
      let xi = (xs[i] + 0.5) | 0; if (xi < 0) xi = 0; else if (xi > w - 1) xi = w - 1;
      let yi = (ys[i] + 0.5) | 0; if (yi < 0) yi = 0; else if (yi > h - 1) yi = h - 1;
      hit[i] = dil[yi * w + xi] > 0 ? 1 : 0;
    }
    return classifyCells(vals, hit);
  }
  function variantPose(pose, variant) {
    const p = clonePose(pose);
    for (const key in variant) {
      p[key] = key === 'scale' ? p[key] * variant[key] : p[key] + variant[key];
      if (key === 'aspect') p[key] = Math.min(Math.max(p[key], 0.3), 1.0);
    }
    return p;
  }

  if (CAM.repeat <= 1) {
    // Nothing pins the rotation: with a single copy, sample agreement is
    // identically 1 and bimodality ranks a full turn almost flat (0.86 at the
    // truth against 0.85 ten degrees out). So settle the geometry, then decode
    // every degree of the turn and let the checksum arbitrate -- a coarse tier
    // has only a few hundred cells, so a whole turn costs well under a second.
    //
    // Sweep the measured geometry as well as the refined pose, measured first.
    // A flat metric makes refinement a random walk, and it walked a decoding
    // pose out of the basin at one image size in nine: the rim-and-pitch
    // geometry alone decodes there, and nothing ranks the two well enough to
    // pick between them.
    const refined = descendPose(respS, w, h, prm,
                                alignScore(respS, w, h, prm)).prm;
    for (const base of [geo, refined]) {
      for (let deg = 0; deg < 360; deg++) {
        const p = clonePose(base);
        p.phi = deg * Math.PI / 180;
        const raw = reading(p);
        if (raw) yield raw;
      }
    }
    for (const pk of phiPeaks(respS, w, h, refined, 1.0, 0.1, 3, 3.0))
      for (const variant of variants) {
        const raw = reading(variantPose(pk.prm, variant));
        if (raw) yield raw;
      }
    return;
  }

  for (const pk of refinePose(respS, w, h, prm).peaks)
    for (const variant of variants) {
      const raw = reading(variantPose(pk.prm, variant));
      if (raw) yield raw;
    }
}

// Deinterleave -> majority vote -> de-whiten -> RS. Shared by both front ends
// so they can be tried in sequence.
function backendDecode(rawValues, rs, tryHard) {
  const nPhys = CAM.n, nLogical = CAM.nLogical, repeat = CAM.repeat;
  const p2l = CAM._inter.physicalToLogical;
  const ordered = new Array(nPhys).fill(null);
  const n = Math.min(nPhys, rawValues.length);
  for (let i = 0; i < n; i++) ordered[p2l[i]] = rawValues[i];

  const whit = CAM._whit;
  const logical = new Array(nLogical), logicalErased = new Array(nLogical);
  // Erase a bit once so many copies are gone that no majority survives.
  const eraseAt = Math.floor(repeat / 2) + 1;
  for (let g = 0; g < nLogical; g++) {
    let ones = 0, zeros = 0, nones = 0;
    for (let r = 0; r < repeat; r++) {
      const v = ordered[g * repeat + r];
      if (v === 1) ones++; else if (v === 0) zeros++; else nones++;
    }
    const b = ones > zeros ? 1 : (zeros > ones ? 0 : whit[g]);
    logical[g] = b ^ whit[g];
    logicalErased[g] = nones >= eraseAt;
  }
  const result = tryDecodeWithLogical(logical, logicalErased, rs);
  if (result) return result;
  return tryHard ? exhaustiveDecode(logical, logicalErased, rs) : null;
}

// ============================================================
// Decoder
// ============================================================
// Tier of the last successful decode, for the UI to report. Set by
// decodePixels, which is the only entry point.
let DECODED_TIER = null;

// RGBA buffer in, decoded text out. This is the single entry point for every
// decode path, and it is deliberately DOM-free so the whole block above the
// `// UI` banner can be lifted verbatim into a worker.
function decodePixels(px, w, h, tryHard) {
  if (tryHard === undefined) tryHard = true;
  const gray = new Float64Array(w * h);
  for (let i = 0, p = 0; i < gray.length; i++, p += 4)
    gray[i] = (px[p] + px[p + 1] + px[p + 2]) / 3;

  const fe = frontEndParams(gray, w, h);
  for (const tier of tierOrder(fe ? fe.merge : null)) {
    CAM.setTier(tier);
    const rs = new RSCodec(TIER_TABLE[tier][2]);
    const deferred = [];
    if (fe) {
      for (const raw of cameraPoseCandidates(fe, tier)) {
        const r = backendDecode(raw, rs, false);
        if (r) { DECODED_TIER = tier; return r; }
        // The exhaustive backend sweeps every plausible payload length, so it
        // costs seconds per candidate. Only the best-ranked poses are worth
        // that; the rest are geometry the cheap pass already rejected by a wide
        // margin.
        if (tryHard && deferred.length < 4) deferred.push(raw);
      }
      for (const raw of deferred) {
        const r = backendDecode(raw, rs, true);
        if (r) { DECODED_TIER = tier; return r; }
      }
    }
    const legacy = decodeLegacy(px, w, h, rs, tryHard);
    if (legacy) { DECODED_TIER = tier; return legacy; }
  }
  DECODED_TIER = null;
  return null;
}

// Pre-camera path: assumes the bagel is upright and roughly fills the frame.
// Kept as the fallback because it is far cheaper, and a clean uploaded render
// still hits it whenever the pose search misses.
function decodeLegacy(px, w, h, rs, tryHard) {
  function getBri(x, y) {
    x = Math.max(0, Math.min(w-1, x)); y = Math.max(0, Math.min(h-1, y));
    const i = (y*w+x)*4;
    return (px[i]+px[i+1]+px[i+2])/3;
  }

  const circle = detectBagelCircle(w, h, getBri);
  if (!circle) return null;

  // Normalize to canonical space
  const ccx = DEFAULT_IMAGE_SIZE/2, ccy = DEFAULT_IMAGE_SIZE/2;
  const cp = getRingParams(DEFAULT_IMAGE_SIZE);
  // Scale from seed-ring radii stays correct when the rim is cropped/damaged
  const ringScale = estimateScaleFromRings(px, w, h, circle.ccx, circle.ccy, circle.detectedInnerR);
  const scale = ringScale !== null ? ringScale : cp.outer_r / Math.max(circle.detectedOuterR, 1);
  // Nearest-neighbour resample into canonical space, on white. The buffer is
  // built by hand rather than through a canvas so this stays DOM-free and can run
  // in the worker; a putImageData/getImageData round trip returns byte-identical
  // data anyway, so the canvas bought nothing here.
  const nd = new Uint8ClampedArray(DEFAULT_IMAGE_SIZE * DEFAULT_IMAGE_SIZE * 4);
  nd.fill(255);
  for (let py = 0; py < DEFAULT_IMAGE_SIZE; py++) {
    for (let ppx = 0; ppx < DEFAULT_IMAGE_SIZE; ppx++) {
      const sx = (ppx - ccx)/scale + circle.ccx;
      const sy = (py - ccy)/scale + circle.ccy;
      if (sx >= 0 && sx < w-1 && sy >= 0 && sy < h-1) {
        const si = ((sy | 0)*w + (sx | 0))*4;
        const di = (py*DEFAULT_IMAGE_SIZE+ppx)*4;
        nd[di]=px[si]; nd[di+1]=px[si+1]; nd[di+2]=px[si+2]; nd[di+3]=255;
      }
    }
  }
  const cdata = nd;
  function cBri(x,y) {
    x = Math.max(0, Math.min(DEFAULT_IMAGE_SIZE-1, Math.round(x)));
    y = Math.max(0, Math.min(DEFAULT_IMAGE_SIZE-1, Math.round(y)));
    const i = (y*DEFAULT_IMAGE_SIZE+x)*4;
    return (cdata[i]+cdata[i+1]+cdata[i+2])/3;
  }

  const grid = CAM._grid;
  const damage = borderWhiteMask(cdata, DEFAULT_IMAGE_SIZE);
  const rawValues = readPresence(grid, cBri, damage);
  return backendDecode(rawValues, rs, tryHard);
}

function tryDecodeWithLogical(logical, logicalErased, rs) {
  const metaBits = logical.slice(0, METADATA_BYTES * 8);
  let vb = 0, pl = 0;
  for (let j = 0; j < 8; j++) vb = (vb<<1)|metaBits[j];
  for (let j = 0; j < 16; j++) pl = (pl<<1)|metaBits[8+j];
  // The header tier is authoritative, and this check is what lets the
  // auto-detect sweep reject a wrong geometric guess: a pose sampled at the
  // wrong pitch cannot read these bits correctly in the first place.
  const {tier, version} = unpackVersionByte(vb);
  if (tier !== CAM.tier) return null;
  if (!VERSION_TABLE[version] || pl > VERSION_TABLE[version]) return null;
  return decodePayloadLogical(logical, logicalErased, rs, pl);
}

function decodePayloadLogical(logical, logicalErased, rs, payloadLen) {
  const overheadBytes = VERSION_HEADER.length + 2 + 4 + rs.nsym;
  const dataLogicalBytes = overheadBytes + payloadLen;
  const start = METADATA_BYTES * 8;
  const end = start + dataLogicalBytes * 8;
  if (end > logical.length) return null;

  const dataBytes = new Uint8Array(dataLogicalBytes);
  const erasureBytePos = [];
  for (let i = 0; i < dataLogicalBytes; i++) {
    let val = 0, hasE = false;
    for (let j = 0; j < 8; j++) {
      const k = start + i*8 + j;
      val = (val<<1)|logical[k];
      if (logicalErased[k]) hasE = true;
    }
    dataBytes[i] = val;
    if (hasE) erasureBytePos.push(i);
  }

  const decoded = rs.decode(dataBytes, erasureBytePos.length > 0 ? erasureBytePos : null);
  if (!decoded) return null;
  const hl = VERSION_HEADER.length;
  if (decoded.length < hl+6) return null;
  for (let i = 0; i < hl; i++) if (decoded[i] !== VERSION_HEADER[i]) return null;

  const dpl = (decoded[hl]<<8)|decoded[hl+1];
  if (dpl !== payloadLen) return null;
  const ps = hl+2, pe = ps+dpl;
  if (pe+4 > decoded.length) return null;

  const payload = decoded.slice(ps, pe);
  const storedHash = decoded.slice(pe, pe+4);
  const check = new Uint8Array(hl+2+dpl);
  check.set(VERSION_HEADER, 0);
  check[hl] = (dpl>>8)&0xFF; check[hl+1] = dpl&0xFF;
  check.set(payload, hl+2);
  const expected = sha256First4(check);
  for (let i = 0; i < 4; i++) if (storedHash[i] !== expected[i]) return null;

  return new TextDecoder().decode(payload);
}

function exhaustiveDecode(logical, logicalErased, rs) {
  const overhead = VERSION_HEADER.length + 2 + 4 + rs.nsym;
  const maxPayload = Math.floor(CAM.nLogical/8) - METADATA_BYTES - overhead;
  for (let guess = 5; guess <= Math.min(250, maxPayload); guess++) {
    const r = decodePayloadLogical(logical, logicalErased, rs, guess);
    if (r) return r;
  }
  return null;
}

// Circle detection
function detectBagelCircle(w, h, getBri) {
  let minX=w,maxX=0,minY=h,maxY=0,found=false;
  const step = Math.max(1, Math.floor(Math.min(w,h)/200));
  for (let y=0;y<h;y+=step) for (let x=0;x<w;x+=step)
    if (getBri(x,y)<230) { minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);found=true; }
  if (!found) return null;

  const candidates = [{cx:(minX+maxX)/2,cy:(minY+maxY)/2},{cx:w/2,cy:h/2}];
  let best=null, bestCount=-1;

  for (const {cx:icx,cy:icy} of candidates) {
    let ccx=icx,ccy=icy,outerR=null,innerR=null;
    let lastOuterCount=0;
    for (let iter=0;iter<5;iter++) {
      const nA=180,outerPts=[],innerPts=[];
      for (let ai=0;ai<nA;ai++) {
        const ang=2*Math.PI*ai/nA,dx=Math.cos(ang),dy=Math.sin(ang);
        // Outer edge: dark->bright transition preceded by a long dark run
        // (the bagel body). Short dark runs are sesame seeds, not the rim.
        let darkRun=0;
        for (let r=5;r<Math.min(w,h)/2;r++) {
          const px=Math.round(ccx+r*dx),py=Math.round(ccy+r*dy);
          if (px<0||px>=w||py<0||py>=h) break;
          const b=getBri(px,py);
          if (b<220) { darkRun++; }
          else {
            if (darkRun>=30 && b>240) { outerPts.push({x:ccx+r*dx,y:ccy+r*dy}); break; }
            darkRun=0;
          }
        }
        const cb=getBri(Math.round(ccx),Math.round(ccy));
        for (let r=1;r<300;r++) {
          const px=Math.round(ccx+r*dx),py=Math.round(ccy+r*dy);
          if (px<0||px>=w||py<0||py>=h) break;
          if (getBri(px,py)<cb-25) { innerPts.push({x:ccx+r*dx,y:ccy+r*dy});break; }
        }
      }
      if (outerPts.length<6) break;
      lastOuterCount=outerPts.length;
      const f=fitCircleRobust(outerPts);
      ccx=f.cx;ccy=f.cy;outerR=f.r;
      if (innerPts.length>=6) { const fi=fitCircleRobust(innerPts);innerR=fi.r; }
      else innerR=Math.max(1,outerR*RING_INNER_RATIO/RING_OUTER_RATIO);
    }
    if (outerR && lastOuterCount > bestCount) {
      bestCount = lastOuterCount;
      best = {ccx,ccy,detectedOuterR:outerR,detectedInnerR:innerR||outerR*RING_INNER_RATIO/RING_OUTER_RATIO};
    }
  }
  return best;
}

function fitCircle(points) {
  const n=points.length;
  let sx=0,sy=0;
  for (const p of points){sx+=p.x;sy+=p.y;}
  const mx=sx/n,my=sy/n;
  let Suu=0,Suv=0,Svv=0,Suuu=0,Suvv=0,Svuu=0,Svvv=0;
  for (const p of points) {
    const u=p.x-mx,v=p.y-my;
    Suu+=u*u;Suv+=u*v;Svv+=v*v;Suuu+=u*u*u;Suvv+=u*v*v;Svuu+=v*u*u;Svvv+=v*v*v;
  }
  const det=Suu*Svv-Suv*Suv;
  if (Math.abs(det)<1e-10) return {cx:mx,cy:my,r:Math.sqrt(Suu+Svv)};
  const b1=0.5*(Suuu+Suvv),b2=0.5*(Svuu+Svvv);
  const uc=(Svv*b1-Suv*b2)/det,vc=(Suu*b2-Suv*b1)/det;
  return {cx:mx+uc,cy:my+vc,r:Math.sqrt(uc*uc+vc*vc+(Suu+Svv)/n)};
}

function fitCircleRobust(points, maxIter=5) {
  let pts=[...points];
  for (let i=0;i<maxIter;i++) {
    if (pts.length<6) break;
    const {cx,cy,r}=fitCircle(pts);
    const ds=pts.map(p=>Math.abs(Math.sqrt((p.x-cx)**2+(p.y-cy)**2)-r));
    const sorted=[...ds].sort((a,b)=>a-b);
    const med=sorted[Math.floor(sorted.length/2)];
    const thr=Math.max(med*3,15);
    pts=pts.filter((_,j)=>ds[j]<thr);
  }
  return pts.length>=6 ? fitCircle(pts) : fitCircle(points);
}

function readPresence(grid, getBri, damage) {
  const S = DEFAULT_IMAGE_SIZE;
  // A merged seed spans merge cells across, so the patch that has to contain
  // it grows with the tier; sampling a fixed 5x5 window reads bare dough for
  // anything coarser than L1.
  const pr = 2 * CAM.merge;
  const values = [];
  for (const {x,y} of grid) {
    const ix=Math.round(x),iy=Math.round(y);
    let sum=0,cnt=0,dmg=false;
    for (let dy=-pr;dy<=pr;dy++) for (let dx=-pr;dx<=pr;dx++) {
      const px=ix+dx,py=iy+dy;
      if (px>=0&&py>=0&&px<S&&py<S) {
        sum+=getBri(px,py); cnt++;
        if (damage[py*S+px]) dmg=true;
      }
    }
    const b = cnt>0 ? sum/cnt : 128;
    if (b >= SESAME_PRESENT_MIN) {
      // Bright cell overlapping border-connected white damage is unreliable
      values.push(dmg ? null : 1);
    }
    else if (b <= SESAME_ABSENT_MAX) values.push(0);
    else values.push(null);
  }
  return values;
}

function borderWhiteMask(cdata, S) {
  const mask = new Uint8Array(S*S);
  const stack = [];
  const bri = i => (cdata[i*4]+cdata[i*4+1]+cdata[i*4+2])/3;
  const push = (x,y) => { const i=y*S+x; if (bri(i)>=250 && !mask[i]) { mask[i]=1; stack.push(i); } };
  for (let x=0;x<S;x++) { push(x,0); push(x,S-1); }
  for (let y=0;y<S;y++) { push(0,y); push(S-1,y); }
  while (stack.length) {
    const i = stack.pop();
    const x = i%S, y = (i-x)/S;
    if (x>0) push(x-1,y);
    if (x<S-1) push(x+1,y);
    if (y>0) push(x,y-1);
    if (y<S-1) push(x,y+1);
  }
  return mask;
}

// Match observed seed-ring radii against canonical ring radii to recover
// the image scale; robust when the outer rim is cropped or damaged.
function estimateScaleFromRings(px, w, h, cx, cy, innerREst) {
  const bri = (x,y) => {
    x=Math.max(0,Math.min(w-1,x)); y=Math.max(0,Math.min(h-1,y));
    const i=(y*w+x)*4;
    return (px[i]+px[i+1]+px[i+2])/3;
  };
  const ci = Math.round(innerREst);
  const rMax = Math.floor(Math.min(w,h)/2)-2;
  if (rMax <= ci+10) return null;

  const nA = 180;
  const rads = [];
  for (let r=ci+3;r<rMax;r++) rads.push(r);
  const counts = new Float64Array(rads.length);
  for (let ai=0;ai<nA;ai++) {
    const ang=2*Math.PI*ai/nA, dx=Math.cos(ang), dy=Math.sin(ang);
    for (let k=0;k<rads.length;k++) {
      const x=Math.round(cx+rads[k]*dx), y=Math.round(cy+rads[k]*dy);
      if (x<0||x>=w||y<0||y>=h) continue;
      if (bri(x,y)>=210) counts[k]++;
    }
  }

  const peaks = [];
  let i = 0;
  while (i < rads.length) {
    if (counts[i] >= 0.2*nA) {
      let j = i+1;
      while (j < rads.length && counts[j] >= 0.2*nA) j++;
      let total=0, wsum=0;
      for (let k=i;k<j;k++) { total+=counts[k]; wsum+=rads[k]*counts[k]; }
      if (total>0) peaks.push(wsum/total);
      i = j;
    } else i++;
  }
  if (peaks.length < 8) return null;

  const cp = getRingParams(DEFAULT_IMAGE_SIZE);
  const nRings = Math.max(1, Math.floor((cp.outer_r - cp.inner_r - 8) / (SESAME_SPACING * CAM.merge)));
  const step = (cp.outer_r - cp.inner_r - 8) / nRings;
  const ringR = [];
  for (let k=0;k<nRings;k++) ringR.push(cp.inner_r + 4 + step*(k+0.5));

  const scoreScale = s => {
    let score = 0;
    for (const p of peaks) {
      const rc = p/s;
      let d = Infinity;
      for (const rr of ringR) { const dd=Math.abs(rc-rr); if (dd<d) d=dd; }
      if (d <= 2.0) score += 1.0 - d/2.0;
    }
    return score;
  };

  let bestScore=-1, bestS=1;
  for (let si=500; si<=2000; si+=10) {
    const sc = scoreScale(si/1000);
    if (sc > bestScore) { bestScore=sc; bestS=si/1000; }
  }
  const base = Math.round(bestS*1000);
  for (let si=base-9; si<=base+9; si+=2) {
    const sc = scoreScale(si/1000);
    if (sc > bestScore) { bestScore=sc; bestS=si/1000; }
  }
  if (bestScore < 0.5*peaks.length) return null;
  return bestS;
}

// ------------------------------------------------------------
// Density-tier picker
//
// The numbers in the note are read back out of tierCapacity() rather than
// written into the markup, so the panel cannot drift from the codec.
// ------------------------------------------------------------
let selectedTier = DEFAULT_TIER;

function buildTierRow() {
  const row = document.getElementById('tier-row');
  row.innerHTML = '';
  for (const t of TIER_IDS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tier-chip';
    b.id = `tier-chip-${t}`;
    b.onclick = () => selectTier(t);
    const lv = document.createElement('span');
    lv.className = 'lv';
    lv.textContent = `L${t}`;
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = TIER_NAMES[t];
    b.append(lv, nm);
    row.appendChild(b);
  }
}

function selectTier(t) {
  selectedTier = t;
  for (const k of TIER_IDS)
    document.getElementById(`tier-chip-${k}`)
      .classList.toggle('active', k === t);
  updateTierNote();
}

function updateTierNote() {
  const note = document.getElementById('tier-note');
  const cap = tierCapacity(selectedTier);
  const used = new TextEncoder()
    .encode(document.getElementById('url-input').value.trim()).length;
  const merge = TIER_TABLE[selectedTier][0];
  note.innerHTML =
    `${escapeHtml(TIER_NOTES[selectedTier])} · ` +
    `容量 <b>${cap}</b> 字节 · 芝麻 ${merge}×${merge} 格 · ` +
    `最小可扫 <b>${TIER_MIN_PX[selectedTier]}</b> px · ` +
    `抗遮挡 <b>${TIER_OCCL_DEG[selectedTier]}°</b>` +
    (used ? `<br>当前链接 <b>${used}</b> 字节` : '');
  note.classList.toggle('over', used > cap);
  if (used > cap) {
    // Capacity falls as the tier number rises, so the fix is a *lower* tier --
    // saying "更高等级" here would send the user the wrong way down the ladder.
    const fits = TIER_IDS.filter(t => tierCapacity(t) >= used);
    note.innerHTML += fits.length
      ? ` — 超出 L${selectedTier} 容量，请改用 ${fits.map(t => 'L' + t).join(' / ')}`
      : ` — 超出所有等级容量，请缩短链接`;
  }
}

function doEncode() {
  const url = document.getElementById('url-input').value.trim();
  if (!url) { showError('encode-error','请输入链接'); return; }
  const btn=document.getElementById('encode-btn'),status=document.getElementById('encode-status'),

}

let uploadedImage = null;

  if (!file) return;

  reader.onload = e => {
    const img = new Image();

      uploadedImage = img;
      document.getElementById('decode-img').src = e.target.result;
      document.getElementById('decode-preview').classList.remove('hidden');

      document.getElementById('decode-error').classList.add('hidden');

const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
