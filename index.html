});

function doDecode() {
  if (!uploadedImage) return;
  const btn=document.getElementById('decode-btn'),status=document.getElementById('decode-status'),
        resultDiv=document.getElementById('decode-result'),errDiv=document.getElementById('decode-error');
  btn.disabled=true; status.textContent='正在解码...';
  errDiv.classList.add('hidden'); resultDiv.classList.add('hidden');
  let img;
  try { img = imagePixels(uploadedImage); }
  catch(e) { showError('decode-error',e.message); status.textContent=''; btn.disabled=false; return; }
  decodePixelsAsync(img.data, img.width, img.height, true, (result, tier) => {
    if (result) { showResult(result, tier); status.textContent='解码成功!'; }
    else { showError('decode-error','解码失败，无法识别芝码'); status.textContent=''; }
    btn.disabled=false;
  });
}

function showResult(result, tier) {
  const resultDiv=document.getElementById('decode-result');
  const safe=escapeHtml(result);
  const badge = (tier === null || tier === undefined) ? ''
    : `<span class="platform-indicator platform-bilibili">L${tier} ${escapeHtml(TIER_NAMES[tier] || '')}</span> `;
  // Only http(s) payloads become clickable. A decoded string is attacker-
  // controlled input -- anyone can print a bagel -- so anything else (plain
  // text, a hex dump of a non-UTF8 payload, a javascript: URL) is shown inert.
  resultDiv.innerHTML = isSafeHttpUrl(result)
    ? `<p>解码结果: ${badge}</p><a href="${safe}" target="_blank" rel="noopener">${safe}</a><div class="actions"><a class="btn btn-secondary" href="${safe}" target="_blank" rel="noopener">跳转链接</a></div>`
    : `<p>解码结果: ${badge}</p><pre class="raw-payload">${safe}</pre>`;
  resultDiv.classList.remove('hidden');
  document.getElementById('decode-error').classList.add('hidden');
}

// ============================================================
// Camera capture
//
// Two paths, because they have very different support:
//   * getUserMedia gives a live viewfinder, so the decoder can try many
//     frames in a row -- a handheld shot is sharp and well framed only for
//     a few frames out of every second, and retrying is what makes phone
//     scanning actually work.
//   * <input capture="environment"> hands off to the native camera app.
//     No live scanning, but it needs no permission prompt and is the only
//     option where getUserMedia is blocked (plain http, some in-app
//     browsers).
// ============================================================
let camStream = null;
let camTimer = null;
let camBusy = false;
let camAuto = true;
let camTorchOn = false;
let camFrames = 0;
const camCanvas = document.createElement('canvas');
// One-shot capture keeps the extra resolution; the live loop trades it for
// frame rate, since a missed decode costs nothing there and the next frame is
// only 120ms away.
const CAM_MAX_DIM = 1280;
const CAM_LIVE_MAX_DIM = 900;
const CAM_INTERVAL_MS = 120;

// ------------------------------------------------------------
// Off-thread decoding
//
// A camera frame costs on the order of a second to localize, align and
// decode. On the UI thread that freezes the viewfinder for the whole time,
// which reads as a hung page rather than a scanner. So the codec runs in a
// worker built from this same script element: everything above the `// UI`
// banner is pure numeric code with no DOM access, and slicing it out keeps a
// single source of truth instead of a second copy that can drift.
// ------------------------------------------------------------
const WORKER_GLUE = `
onmessage = function (e) {
  const d = e.data;
  let result = null;
  try { result = decodePixels(d.px, d.w, d.h, d.tryHard); } catch (err) { result = null; }
  postMessage({id: d.id, result: result, tier: DECODED_TIER});
};
`;

let codecWorker = null;
let codecWorkerDead = false;
let decodeSeq = 0;
const decodePending = new Map();

function getCodecWorker() {
  if (codecWorker || codecWorkerDead) return codecWorker;
  try {
    const full = document.getElementById('codec-src').textContent;
    // Tolerate CRLF: git checks this file out with the platform's endings, and
    // a literal '\n// UI\n' then never matches, silently killing the worker.
    const ui = full.search(/\r?\n\/\/ UI\r?\n/);
    const cut = full.lastIndexOf('// =====', ui);
    if (ui < 0 || cut < 0) throw new Error('codec markers not found');
    const url = URL.createObjectURL(
      new Blob([full.slice(0, cut), WORKER_GLUE], {type: 'text/javascript'}));
    const wk = new Worker(url);
    URL.revokeObjectURL(url);
    wk.onmessage = e => {
      const cb = decodePending.get(e.data.id);
      if (!cb) return;
      decodePending.delete(e.data.id);
      cb(e.data.result, e.data.tier);
    };
    wk.onerror = () => {
      // Some strict CSPs and some browsers' file:// refuse blob workers; fall
      // back to decoding inline rather than losing the feature entirely.
      codecWorkerDead = true;
      codecWorker = null;
      wk.terminate();
      const stale = Array.from(decodePending.values());
      decodePending.clear();
      for (const cb of stale) cb(null, null);
    };
    codecWorker = wk;
  } catch (e) {
    codecWorkerDead = true;
    codecWorker = null;
  }
  return codecWorker;
}

function decodePixelsAsync(px, w, h, tryHard, cb) {
  const wk = getCodecWorker();
  if (!wk) {
    setTimeout(() => {
      let r = null;
      try { r = decodePixels(px, w, h, tryHard); } catch (e) { r = null; }
      cb(r, DECODED_TIER);
    }, 0);
    return;
  }
  const id = ++decodeSeq;
  decodePending.set(id, cb);
  wk.postMessage({id, px, w, h, tryHard}, [px.buffer]);
}

// Grab the current viewfinder as RGBA at a capped long edge.
function grabFrame(video, maxDim) {
  const s = Math.min(1, maxDim / Math.max(video.videoWidth, video.videoHeight));
  const w = Math.max(1, Math.round(video.videoWidth * s));
  const h = Math.max(1, Math.round(video.videoHeight * s));
  camCanvas.width = w; camCanvas.height = h;
  const ctx = camCanvas.getContext('2d', {willReadFrequently: true});
  ctx.drawImage(video, 0, 0, w, h);
  return ctx.getImageData(0, 0, w, h);
}

// Rasterize an <img> to RGBA at its natural size.
function imagePixels(img) {
  const w = img.naturalWidth || img.width;
  const h = img.naturalHeight || img.height;
  if (!w || !h) throw new Error('图片尚未加载');
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', {willReadFrequently: true});
  ctx.drawImage(img, 0, 0);
  return ctx.getImageData(0, 0, w, h);
}

async function openCamera() {
  const overlay=document.getElementById('cam-overlay');
  const video=document.getElementById('cam-video');
  const hint=document.getElementById('cam-hint');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError('decode-error','当前浏览器不支持实时取景，请改用「拍照识别」');
    document.getElementById('capture-input').click();
    return;
  }
  overlay.classList.remove('hidden');
  hint.textContent='正在请求摄像头权限...';
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{ facingMode:{ideal:'environment'},
              width:{ideal:1920}, height:{ideal:1920} }
    });
  } catch(e) {
    hint.textContent='';
    overlay.classList.add('hidden');
    showError('decode-error','无法打开摄像头: '+e.message+'。可改用「拍照识别」');
    return;
  }
  video.srcObject = camStream;
  try { await video.play(); } catch(e) { /* autoplay policy: muted+playsinline should allow it */ }
  camFrames = 0;
  hint.textContent='把贝果放进圆圈里，尽量正对镜头';
  document.getElementById('cam-torch').disabled = !hasTorch();
  scheduleScan(400);
}

function hasTorch() {
  const t = camStream && camStream.getVideoTracks()[0];
  if (!t || !t.getCapabilities) return false;
  try { return !!t.getCapabilities().torch; } catch(e) { return false; }
}

async function toggleTorch() {
  const t = camStream && camStream.getVideoTracks()[0];
  if (!t) return;
  camTorchOn = !camTorchOn;
  try {
    await t.applyConstraints({advanced:[{torch:camTorchOn}]});
    document.getElementById('cam-torch').classList.toggle('on', camTorchOn);
  } catch(e) { camTorchOn = false; }
}

function toggleAutoScan() {
  camAuto = !camAuto;
  document.getElementById('cam-auto').classList.toggle('on', camAuto);
  if (camAuto) scheduleScan(0); else clearTimeout(camTimer);
}

function scheduleScan(delay) {
  clearTimeout(camTimer);
  camTimer = setTimeout(scanFrame, Math.max(0, delay));
}

function scanFrame() {
  const video=document.getElementById('cam-video');
  if (!camStream || camBusy || !camAuto) return;
  if (!video.videoWidth || video.readyState < 2) { scheduleScan(CAM_INTERVAL_MS); return; }

  const frame = grabFrame(video, CAM_LIVE_MAX_DIM);
  camBusy = true;
  camFrames++;
  // tryHard=false: the exhaustive backend costs seconds per candidate and the
  // next frame arrives in a fraction of that, so retrying cheaply beats
  // grinding on one bad frame.
  decodePixelsAsync(frame.data, frame.width, frame.height, false, (result, tier) => {
    camBusy = false;
    if (!camAuto || !camStream) return;   // overlay closed while we were working
    if (result) { onCameraSuccess(result, tier); return; }
    document.getElementById('cam-hint').textContent =
      `未识别，正在重试… (第 ${camFrames} 帧)`;
    scheduleScan(CAM_INTERVAL_MS);
  });
}

function captureStill() {
  const video=document.getElementById('cam-video');
  if (!video.videoWidth) return;
  camAuto = false;
  clearTimeout(camTimer);
  // Freeze the frame on screen so the user is looking at what gets decoded.
  const frame = grabFrame(video, CAM_MAX_DIM);
  const frozen = document.createElement('canvas');
  frozen.width = frame.width; frozen.height = frame.height;
  frozen.getContext('2d').putImageData(frame, 0, 0);
  video.srcObject = null;
  document.getElementById('cam-hint').textContent='正在解码…';
  decodePixelsAsync(frame.data, frame.width, frame.height, true, (result, tier) => {
    if (result) { onCameraSuccess(result, tier); return; }
    uploadedImage = new Image();
    uploadedImage.src = frozen.toDataURL('image/png');
    document.getElementById('decode-img').src = uploadedImage.src;
    document.getElementById('decode-preview').classList.remove('hidden');
    document.getElementById('decode-btn').disabled = false;
    closeCamera();
    showError('decode-error','这一帧没能识别，可点「解码芝码」用已保存的画面重试，或换个角度重拍');
  });
}

function onCameraSuccess(result, tier) {
  closeCamera();
  showResult(result, tier);
  document.getElementById('decode-status').textContent = `解码成功! (扫描 ${camFrames} 帧)`;
  // "抬手扫描即跳转": a scanned code is meant to be followed, not read. Only
  // http(s) payloads navigate -- anything else (arbitrary text, a hex dump of
  // a non-UTF8 payload) is displayed instead, which also rules out a
  // javascript: URL smuggled in through an image.
  if (isSafeHttpUrl(result)) setTimeout(() => { window.location.href = result; }, 600);
}

function closeCamera() {
  clearTimeout(camTimer);
  camBusy = false;
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  const video=document.getElementById('cam-video');
  video.srcObject = null;
  camTorchOn = false;
  document.getElementById('cam-torch').classList.remove('on');
  document.getElementById('cam-guide').classList.remove('locked');
  document.getElementById('cam-overlay').classList.add('hidden');
}

function showError(id, msg) {
  const el=document.getElementById(id); el.textContent=msg; el.classList.remove('hidden');
}
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Decoded payloads are untrusted input: only real http(s) URLs are ever turned
// into a link or navigated to.
function isSafeHttpUrl(s) {
  if (typeof s !== 'string' || !s) return false;
  let u;
  try { u = new URL(s); } catch (e) { return false; }
  return u.protocol === 'http:' || u.protocol === 'https:';
}

buildTierRow();
selectTier(DEFAULT_TIER);
</script>
</body>
</html>
